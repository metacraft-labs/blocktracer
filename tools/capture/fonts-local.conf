<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic text rasterisation inside the pinned capture container.

  These mirror the Chromium flags in lib/determinism.mjs at the fontconfig
  layer, so a face that reaches FreeType directly is rendered the same way as
  one that goes through Skia's own path. Hinting, autohinting, embedded
  bitmaps, subpixel order and the LCD filter are all host-configurable on a
  normal Linux desktop, and every one of them moves glyph pixels.

  Antialiasing stays ON: this is a container for producing images a human
  reviews, and turning it off would make every capture in the campaign harder
  to judge in order to make a hash marginally easier to reproduce.
-->
<fontconfig>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
