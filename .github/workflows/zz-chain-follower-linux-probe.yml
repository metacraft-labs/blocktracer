# TEMPORARY PROBE — NOT PART OF THE GATE.
#
# The job body below is byte-identical to the `chain-follower-linux` job that
# lands in ci.yml. It exists on this branch only, with a push trigger on this
# branch only, so the gate can be iterated on without firing ci.yml`s nine
# other jobs (two of which are 66-92 minute journey shards) against a
# saturated ephemeral pool. Deleted before this branch lands.
name: chain-follower-linux-probe

on:
  push:
    branches: ['bt/follower-linux-ci']
  workflow_dispatch:

concurrency:
  group: chain-follower-linux-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # ING-1 — THE CHAIN FOLLOWER, BUILT ON THE PLATFORM IT DEPLOYS TO
  # ═════════════════════════════════════════════════════════════════════════════
  #
  # `tools/chain/nix` packages the follower into the five outputs
  # `metacraft-labs/infra`'s `services/blocktracer-ingest` consumes. All of them
  # were built, and the follower proven end to end, on aarch64-darwin. The unit
  # runs on x86_64-linux. Until this job existed:
  #
  #   * 0 of the 4 buildable outputs had EVER been built for x86_64-linux. They
  #     EVALUATED there, which is a statement about the expression and not about
  #     the compiler, the npm cache, or the linker.
  #   * 0 of the 5 workflow files in `.github/workflows/` named any of them
  #     (`chain-tools`, `chain-runtime`, `aztec-ct-writer-wasm`, `chain-follower`,
  #     `chain-follower-nodejs`) — counted over all 5 files on 2026-09-08. The
  #     only `nix build` targets in CI were `.#default` and `.#${FLAKE_TARGET}`.
  #
  # So the deployable half of this repository was ungated on its own platform,
  # and a change that broke it would have been found by the systemd unit.
  #
  # WHY BARE METAL AND NOT `eph-linux-x64`. Two reasons, and the second is the
  # load-bearing one:
  #
  #   1. The 14-slot GARM ephemeral pool is routinely saturated (measured
  #      2026-09-08: 14 of 14 busy or offline, behind a codetracer queue). The
  #      bare-metal pool this targets had 5 of 8 runners idle at the same moment.
  #   2. AN EPHEMERAL RUNNER HAS A COLD /nix/store EVERY TIME. This job's cost is
  #      almost entirely first-build cost — an offline `npm ci` of the replay
  #      driver and a wasm32 cargo build of the `.ct` writer. On a persistent
  #      NixOS host every run after the inputs stop moving is a store hit and
  #      costs about as much as `nix build .#default` does today. A gate priced
  #      at its cold-build cost on every commit is a gate that gets removed.
  #
  # WHAT THIS DOES NOT COVER, said here rather than discovered later: `avm.wasm`.
  # `tools/chain/nix`'s header records why it is not built (barretenberg
  # `FetchContent`s at configure time, and its own build script demands 8 GB of
  # work space), and `avmWasm` defaults to `null` by design. So no replay runs
  # here — there is no AVM to replay with, on Linux or anywhere else. The
  # follower probe below is written to be the strongest claim that is available
  # WITHOUT one, and it is a real claim, not a smoke test: see its comment.
  chain-follower-linux:
    runs-on: [self-hosted, x86-64-v3, gpu, rr-hw-counters]
    # Sized for a COLD store: the wasm32 cargo build is the long pole. A warm
    # run is minutes. If this is ever hit, note that a `timeout-minutes`
    # exhaustion is reported by the API as `cancelled`, not `failure`.
    timeout-minutes: 120
    env:
      # ONE definition of where the report is written, read by the writer, the
      # listing and the upload alike. A collect step that reads a different
      # directory than the job wrote uploads an empty artefact and still goes
      # green; that has happened in this repository's CI before.
      REPORT_DIR: chain-linux-report
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: The platform this job is actually standing on
        # THE JOB'S WHOLE CLAIM IS "ON LINUX". A label set that silently stopped
        # matching the intended pool, or a runner reimaged to something else,
        # would leave every step below passing and the claim false. So the
        # platform is asserted, not printed and trusted.
        run: |
          set -euo pipefail
          uname -srm
          sys="$(nix eval --impure --raw --expr 'builtins.currentSystem')"
          echo "nix system: ${sys}"
          test "${sys}" = x86_64-linux \
            || { echo "REFUSED: this job exists to build for x86_64-linux and is on '${sys}'"; exit 1; }
          mkdir -p "${REPORT_DIR}"
          { echo "runner: $(uname -srm)"; echo "nix-system: ${sys}"; } > "${REPORT_DIR}/platform.txt"

      # ── The four buildable outputs, one step each ────────────────────────────
      #
      # ONE PACKAGE PER STEP, in dependency order, so a failure is named by the
      # step that failed rather than by a line somewhere in a combined log.
      # `chain-follower` composes the other three, so by the time it runs the
      # first three are store hits and its step measures only the wrapper.
      #
      # `-L` on every one: nix prints only the last few lines of a failed
      # builder by default and refers you to `nix log <drv>` — which a
      # subsequent step cannot resolve without knowing which derivation died.
      # With `-L` the log that explains a failure is IN the failing step. On a
      # warm store it prints nothing at all, so this costs nothing to keep.
      - name: Build chain-tools (x86_64-linux)
        run: |
          set -euo pipefail
          p="$(nix build .#chain-tools -L --no-link --print-out-paths)"
          echo "CHAIN_TOOLS=${p}" >> "$GITHUB_ENV"
          echo "$p"

      - name: Build chain-runtime (x86_64-linux)
        run: |
          set -euo pipefail
          p="$(nix build .#chain-runtime -L --no-link --print-out-paths)"
          echo "CHAIN_RUNTIME=${p}" >> "$GITHUB_ENV"
          echo "$p"

      - name: Build aztec-ct-writer-wasm (x86_64-linux)
        run: |
          set -euo pipefail
          p="$(nix build .#aztec-ct-writer-wasm -L --no-link --print-out-paths)"
          echo "CT_WRITER=${p}" >> "$GITHUB_ENV"
          echo "$p"

      - name: Build chain-follower (x86_64-linux)
        run: |
          set -euo pipefail
          p="$(nix build .#chain-follower -L --no-link --print-out-paths)"
          echo "CHAIN_FOLLOWER=${p}" >> "$GITHUB_ENV"
          echo "$p"

      - name: Build chain-follower-nodejs (x86_64-linux)
        # The fifth output. It is `pkgs.nodejs_22` and will always be a
        # substituter hit, but the infra module names it as its `nodePackage`
        # and an output nothing builds is an output nothing would notice losing.
        run: |
          set -euo pipefail
          p="$(nix build .#chain-follower-nodejs -L --no-link --print-out-paths)"
          echo "FOLLOWER_NODE=${p}" >> "$GITHUB_ENV"
          "$p/bin/node" --version

      # ── What the store paths actually contain ───────────────────────────────
      - name: Every path the infra module names exists in the Linux build
        # `services/blocktracer-ingest` fails at EVAL naming a missing option,
        # but it cannot tell you that an option's store path is missing the file
        # inside it — that is a refusal hours into a watch. Each of these is a
        # path the module or the follower reaches for by name.
        run: |
          set -euo pipefail
          fail=0
          need_file() { if [ -f "$1" ]; then echo "  ok   file $1"; else echo "  MISSING file $1"; fail=1; fi; }
          need_dir()  { if [ -d "$1" ]; then echo "  ok   dir  $1"; else echo "  MISSING dir  $1"; fail=1; fi; }

          echo "chain-tools — blocktracerSrc:"
          need_file "${CHAIN_TOOLS}/tools/chain/follow-chain.mjs"
          need_file "${CHAIN_TOOLS}/tools/chain/lib/replay.mjs"

          echo "chain-runtime — runtime.src:"
          need_file "${CHAIN_RUNTIME}/replay/tools/replay_settled_transaction.mjs"
          need_file "${CHAIN_RUNTIME}/node-host/src/loader.ts"
          need_file "${CHAIN_RUNTIME}/replay/src/artifact_resolution.ts"
          need_dir  "${CHAIN_RUNTIME}/replay/node_modules/@aztec/stdlib"
          need_file "${CHAIN_RUNTIME}/.runtime-commit"

          echo "aztec-ct-writer-wasm — runtime.ctWriterWasm:"
          need_file "${CT_WRITER}/lib/aztec_ct_writer.wasm"

          echo "chain-follower:"
          need_file "${CHAIN_FOLLOWER}/bin/blocktracer-follow-chain"

          test "$fail" = 0

      - name: The runtime commit the packaged follower will stamp
        # `follow-chain.mjs` stamps `provenance.runtimeCommit` from `git rev-parse`
        # inside the runtime; a store path has no `.git`, and `run()` does not
        # throw on a non-zero exit, so the fallback file is the only thing
        # standing between every Linux capture and an EMPTY recorder version.
        # Assert it equals the flake's pin rather than merely that it is present.
        #
        # Read out of `flake.lock` with node rather than `jq`: these runners are
        # bare-metal NixOS hosts whose PATH is not a devshell's, and a check
        # that fails because a tool is missing reports on the runner rather
        # than on the subject. `chain-follower-nodejs` was just built; it is
        # the one interpreter this job is entitled to assume.
        run: |
          set -euo pipefail
          stamped="$(cat "${CHAIN_RUNTIME}/.runtime-commit")"
          pinned="$("${FOLLOWER_NODE}/bin/node" -e '
            const l = JSON.parse(require("node:fs").readFileSync("flake.lock", "utf8"));
            process.stdout.write(l.nodes["aztec-avm-runtime"].locked.rev);
          ')"
          echo "stamped: ${stamped}"
          echo "pinned:  ${pinned}"
          test "${stamped}" = "${pinned}" \
            || { echo "REFUSED: the packaged runtime would stamp a commit the flake does not pin"; exit 1; }
          echo "runtime-commit=${stamped}" >> "${REPORT_DIR}/platform.txt"

      - name: No Mach-O smuggled into the Linux runtime by the fixed-output npm cache
        # THE ONE PLACE A DARWIN-COMPUTED HASH COULD HAVE PRODUCED A DARWIN
        # ARTEFACT. `fetchNpmDeps`'s hash is over the tarball set the lockfile
        # names, and npm lockfiles carry per-platform optional dependencies —
        # so a cache populated on darwin and reused on Linux is exactly the
        # shape that yields a tree with the wrong native binaries in it. This
        # enumerates every native module in the installed tree and reports what
        # each one is; a Mach-O here is a defect that would surface as a load
        # failure on the first replay and not before.
        #
        # The magic bytes are read directly rather than shelled out to `file`,
        # which a NixOS runner's PATH need not have. THE COUNT IS PRINTED WITH
        # ITS POPULATION: zero native modules is a real and expected answer for
        # an `--omit=dev` install of this lockfile, and "0 bad" would otherwise
        # be indistinguishable from "the find matched nothing because the path
        # was wrong". The path is therefore asserted to exist first.
        run: |
          set -euo pipefail
          test -d "${CHAIN_RUNTIME}/replay/node_modules" \
            || { echo "REFUSED: replay/node_modules does not exist — the scan below would be vacuous"; exit 1; }
          "${FOLLOWER_NODE}/bin/node" -e '
            const fs = require("node:fs"), path = require("node:path");
            const root = path.join(process.argv[1], "replay/node_modules");
            const found = [];
            let dirs = 0;
            (function walk(d) {
              dirs++;
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.isFile() && p.endsWith(".node")) found.push(p);
              }
            })(root);
            const b = Buffer.alloc(4);
            let bad = 0;
            console.log(`scanned ${dirs} directories under replay/node_modules`);
            console.log(`native modules (population: every *.node file in that tree): ${found.length}`);
            for (const f of found) {
              const fd = fs.openSync(f, "r"); fs.readSync(fd, b, 0, 4, 0); fs.closeSync(fd);
              const magic = b.toString("hex");
              const kind = magic === "7f454c46" ? "ELF"
                : ["cffaedfe", "cefaedfe", "cafebabe"].includes(magic) ? "MACH-O" : `unknown(${magic})`;
              console.log(`  ${kind}  <-  ${path.relative(root, f)}`);
              if (kind === "MACH-O") bad++;
            }
            if (bad) { console.error(`REFUSED: ${bad} Mach-O object(s) installed in the Linux runtime`); process.exit(1); }
            fs.appendFileSync(process.argv[2], `native-modules=${found.length}\nnode-modules-dirs=${dirs}\n`);
          ' "${CHAIN_RUNTIME}" "${REPORT_DIR}/platform.txt"

      - name: The Linux-built .ct writer is a wasm module this node can compile
        # `nix build` succeeding says the linker ran. It does not say the bytes
        # are a loadable module — and `lld` is the wasm32 linker that the
        # workstation build got from a rustup toolchain and this package had to
        # name for itself. Compiling it in the very node the follower runs on is
        # the check that would have caught a linker that produced an object
        # nothing can instantiate.
        run: |
          set -euo pipefail
          w="${CT_WRITER}/lib/aztec_ct_writer.wasm"
          ls -l "$w"
          "${FOLLOWER_NODE}/bin/node" -e '
            const fs = require("node:fs"), crypto = require("node:crypto");
            const bytes = fs.readFileSync(process.argv[1]);
            const sha = crypto.createHash("sha256").update(bytes).digest("hex");
            console.log(`sha256: ${sha}`);
            if (bytes.subarray(0, 4).toString("hex") !== "0061736d") {
              console.error("REFUSED: the file does not start with the wasm magic"); process.exit(1);
            }
            const m = new WebAssembly.Module(bytes);
            const ex = WebAssembly.Module.exports(m);
            const im = WebAssembly.Module.imports(m);
            console.log(`compiled: ${bytes.length} bytes, ${ex.length} exports, ${im.length} imports`);
            console.log("exports:", ex.map((e) => e.name).join(" "));
            if (ex.length === 0) { console.error("REFUSED: the module exports nothing"); process.exit(1); }
            fs.appendFileSync(process.argv[2], `ct-writer-sha256=${sha}\nct-writer-bytes=${bytes.length}\nct-writer-exports=${ex.length}\n`);
          ' "$w" "${REPORT_DIR}/platform.txt"

      # ── The follower itself, run on Linux ───────────────────────────────────
      - name: The packaged follower runs on Linux, and its arguments reach it
        # THIS IS A CLAIM, NOT A SMOKE TEST, AND IT IS THE STRONGEST ONE
        # AVAILABLE WITHOUT AN avm.wasm.
        #
        # Probe A runs the wrapper with no arguments. Reaching the `--avm`
        # refusal at all means: the wrapper's shell ran, `node` started, node
        # resolved and executed `follow-chain.mjs` out of the chain-tools store
        # path, that module's import of `lib/replay.mjs` succeeded, and the
        # `--runtime` and `--ct-writer` the wrapper bakes in were both accepted.
        # Everything up to the AVM is exercised.
        #
        # Probe B is the one that earns its place. `tools/chain/nix`'s wrapper
        # comment records a defect that BUILT PERFECTLY and failed on first use:
        # a backslash-continued interpolation went empty, the continuation ate
        # the newline, `"$@"` became a separate command, and every argument the
        # caller passed was silently dropped — so the tool refused for a missing
        # `--avm` it had in fact been given. Probe B passes an `--avm` that does
        # not exist and requires the refusal to name THAT PATH. If passthrough
        # were broken the run would still exit 2, and would print probe A's
        # message. Exit code alone cannot tell the two apart; the message can.
        run: |
          set -euo pipefail
          bin="${CHAIN_FOLLOWER}/bin/blocktracer-follow-chain"

          echo "── probe A: no arguments ────────────────────────────────────"
          set +e
          a_out="$("$bin" 2>&1)"; a_rc=$?
          set -e
          echo "exit ${a_rc}"; printf '%s\n' "$a_out"
          test "$a_rc" = 2 || { echo "REFUSED: expected exit 2, got ${a_rc}"; exit 1; }
          printf '%s' "$a_out" | grep -qF -- '--avm <avm.wasm>' \
            || { echo "REFUSED: probe A did not reach the --avm requirement"; exit 1; }

          echo "── probe B: an --avm the caller supplies ────────────────────"
          set +e
          b_out="$("$bin" --avm /nonexistent/passthrough-probe.wasm 2>&1)"; b_rc=$?
          set -e
          echo "exit ${b_rc}"; printf '%s\n' "$b_out"
          test "$b_rc" = 2 || { echo "REFUSED: expected exit 2, got ${b_rc}"; exit 1; }
          printf '%s' "$b_out" | grep -qF -- 'avm path does not exist: /nonexistent/passthrough-probe.wasm' \
            || { echo "REFUSED: the wrapper did not pass the caller's --avm through — this is the defect tools/chain/nix's wrapper comment records"; exit 1; }

          { echo "probe-a-rc=${a_rc}"; echo "probe-b-rc=${b_rc}"; } >> "${REPORT_DIR}/platform.txt"

      # ── What this run measured ──────────────────────────────────────────────
      - name: Write the report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          {
            echo "# chain-follower on x86_64-linux"
            echo
            echo "commit: ${GITHUB_SHA}"
            echo "run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner: $(uname -srm)"
            echo
            echo "| output | store path |"
            echo "| --- | --- |"
            echo "| chain-tools | \`${CHAIN_TOOLS:-NOT BUILT}\` |"
            echo "| chain-runtime | \`${CHAIN_RUNTIME:-NOT BUILT}\` |"
            echo "| aztec-ct-writer-wasm | \`${CT_WRITER:-NOT BUILT}\` |"
            echo "| chain-follower | \`${CHAIN_FOLLOWER:-NOT BUILT}\` |"
            echo "| chain-follower-nodejs | \`${FOLLOWER_NODE:-NOT BUILT}\` |"
            echo
            echo '```'
            cat "${REPORT_DIR}/platform.txt" 2>/dev/null || echo "(platform.txt was never written)"
            echo '```'
          } > "${REPORT_DIR}/report.md"
          cat "${REPORT_DIR}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: What is in the report directory
        # Listed BEFORE the upload and from the same variable the upload uses,
        # so a run whose artefact turns out to be empty shows on its face
        # whether the files were missing or the upload dropped them.
        if: always()
        run: ls -la "${REPORT_DIR}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-follower-linux-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
