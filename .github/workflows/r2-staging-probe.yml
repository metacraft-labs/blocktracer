name: R2 staging probe (read-only)

# READ-ONLY. Lists what serves production from R2, so staging can be served the same way
# (operator, 2026-10-23: "Serve staging from R2" as a new bucket + staging.blocktracer.org).
# It creates, changes and deletes nothing: every call below is a GET.

on:
  push:
    branches: [r2-staging-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ["self-hosted", "linux", "x64"]
    timeout-minutes: 15
    steps:
      - name: Inspect the R2 buckets, their domains, and the zone's routing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -uo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          brief() { jq -c "$1" 2>/dev/null || cat; }
          echo "== token permissions (verify)"; api "/user/tokens/verify" | brief '{success, status: .result.status, errors}'
          echo "== R2 buckets"; api "/accounts/$CF_ACCOUNT/r2/buckets" | brief '{success, buckets: [.result.buckets[]?.name], errors}'
          echo "== production bucket's custom domains"; api "/accounts/$CF_ACCOUNT/r2/buckets/$PROD_BUCKET/domains/custom" | brief '{success, domains: [.result.domains[]? | {domain, enabled, status}], errors}'
          echo "== production bucket's managed r2.dev domain"; api "/accounts/$CF_ACCOUNT/r2/buckets/$PROD_BUCKET/domains/managed" | brief '{success, result, errors}'
          ZONE=$(api "/zones?name=blocktracer.org" | jq -r '.result[0].id // empty')
          echo "== zone blocktracer.org: ${ZONE:+found}${ZONE:-NOT VISIBLE TO THIS TOKEN}"
          if [ -n "$ZONE" ]; then
            echo "== worker routes"; api "/zones/$ZONE/workers/routes" | brief '{success, routes: [.result[]? | {pattern, script}], errors}'
            echo "== rulesets"; api "/zones/$ZONE/rulesets" | brief '{success, rulesets: [.result[]? | {id, name, phase}], errors}'
            for phase in http_request_transform http_request_dynamic_redirect http_request_origin; do
              echo "== entrypoint $phase"; api "/zones/$ZONE/rulesets/phases/$phase/entrypoint" | brief '{success, rules: [.result.rules[]? | {description, expression, action, action_parameters}], errors}'
            done
            echo "== DNS for staging / apex"; api "/zones/$ZONE/dns_records?name=staging.blocktracer.org" | brief '{success, records: [.result[]? | {type, name, content, proxied}]}'
            api "/zones/$ZONE/dns_records?name=blocktracer.org" | brief '{success, records: [.result[]? | {type, name, content, proxied}]}'
          fi
          echo "== worker scripts"; api "/accounts/$CF_ACCOUNT/workers/scripts" | brief '{success, scripts: [.result[]?.id], errors}'
