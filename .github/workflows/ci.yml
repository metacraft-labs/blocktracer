name: ci

# THE BRANCHES THIS REPOSITORY ACTUALLY SHIPS FROM.
#
# This read `branches: [main]` until 2026-09-01. `main` exists and was 178
# commits behind `dev` — tip "VD.0: visual-design capture harness (pinned
# container UNVALIDATED)" — and work lands on `dev` by direct push. So every job
# below had not run on the mainline for 178 commits: the only trigger still
# firing was `pull_request`, and a branch that nobody opens a PR from is a branch
# with no CI at all.
#
# The list must equal `deploy.yml`'s, because those are the branches that reach
# a visitor. `ci/test/ci-coverage.sh` asserts exactly that and fails on a branch
# that is deployed and ungated — and on a trigger naming a branch that does not
# exist, which is what made this invisible: dead trigger and working trigger read
# identically in YAML.
# THE THREE NIM JOBS — why `Install Nim` failed in all of them at once.
#
# `contract`, `client-sdk` and `viewmodels` all failed their `Install Nim` step
# on the first mainline run, and it was ONE cause, not three. The action's
# `install_nim.sh` resolves an `x`-ranged version by asking the GitHub API for
# nim-lang/Nim's tags, and it sends the header unconditionally:
#
#     curl -H "Authorization: Bearer ${repo_token}" .../git/refs/tags | jq -r '.[].ref'
#
# `repo-token` has NO default in the action, and none of the three jobs passed
# one — so the header went out as a literal `Authorization: Bearer ` and GitHub
# answered `401 Bad credentials`, a 112-byte JSON OBJECT. Three things then went
# wrong in sequence, and only the last one was visible:
#
#   1. `jq -r '.[].ref'` iterated the error object's values and died with
#      `Cannot index string with string "ref"`.
#   2. It died INSIDE A PIPELINE, so `set -eu` never saw it: the pipeline's
#      status is `sed`'s, and `sed` succeeded on empty input. The resolved
#      version became the empty string and the script carried on.
#   3. The empty version built a download URL that 404s, curl saved the error
#      page, and `tar` reported `This does not look like a tar archive`.
#
# So the log named a corrupt tarball for what was an unauthenticated API call.
# The README's "It works without setting this parameter" is WRONG for any
# `2.n.x` version: an ABSENT Authorization header would have worked at the
# unauthenticated rate limit, but an EMPTY one is refused outright. Every
# `2.n.x` example in that same README passes `repo-token`.
#
# Why it took 178 commits to see: these three jobs are the only ones that
# install Nim from the network rather than from the flake, and no run of them
# reached a runner in that time.
on:
  push:
    branches: [dev, staging, live]
  pull_request:

jobs:
  # Does every suite this repository has actually run, on every branch it ships
  # from? Nothing measured that until 2026-09-01, and the answer was no on both
  # counts. Cheapest job here and first, because a red anywhere below means
  # nothing if the surface has holes in it.
  ci-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Step 4 resolves the trigger's branch names against real refs. A
          # shallow clone has none, and the check would SKIP — which this job
          # reports as a skip, not a pass, but it is better to just have them.
          fetch-depth: 0

      - name: Every suite runs, on every branch we deploy
        run: bash ci/test/ci-coverage.sh

      - name: And the guard bites — four planted holes, four reports
        run: bash ci/test/ci-coverage-test.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          # NOT optional, despite what the action's README says. See the
          # "THE THREE NIM JOBS" note at the top of this file: an absent
          # token makes the action send `Authorization: Bearer ` and get a
          # 401, which it then treats as a tag list.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Conformance test suite
        run: nimble test -y

      - name: Demo generator emits a contract-conformant tree
        run: |
          nim c -r --hints:off src/blocktracer_demo_gen.nim --out:demo-site
          nim c -r --hints:off src/blocktracer_validate.nim demo-site

      - name: Determinism — regenerate and diff
        run: |
          nim c -r --hints:off src/blocktracer_demo_gen.nim --out:demo-site-2
          diff -r demo-site demo-site-2

  # M12a — @blocktracer/client. Its own job, because the boundary guard is the
  # cheap half (bash + awk, no toolchain) and must not wait on a Nim build to
  # tell someone their import crossed the layer.
  client-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Embed SDK
        id: pin
        # Only the KEY=VALUE lines; the file's comments explain WHY the pin is
        # recorded as a commit and are not step outputs.
        run: grep -E '^[A-Z_]+=' ci/embed-sdk-pin.env >> "$GITHUB_OUTPUT"

      # The Embed SDK lives in another repository. Only src/frontend is needed
      # (6.7 MB of the tree), so the checkout is sparse and blobless.
      - name: Check out the pinned CodeTracer Embed SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.CODETRACER_REPO }}
          ref: ${{ steps.pin.outputs.CODETRACER_REF }}
          path: codetracer
          filter: blob:none
          sparse-checkout: |
            src/frontend
            ci/test
          sparse-checkout-cone-mode: false

      - name: Check out the pinned IsoNim
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.ISONIM_REPO }}
          ref: ${{ steps.pin.outputs.ISONIM_REF }}
          path: isonim
          filter: blob:none

      - name: Check out the pinned nim-everywhere
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.NIM_EVERYWHERE_REPO }}
          ref: ${{ steps.pin.outputs.NIM_EVERYWHERE_REF }}
          path: nim-everywhere
          filter: blob:none

      - name: Client SDK import boundary — the guard's own self-test
        # Every rule driven against a synthetic tree carrying ONE deliberate
        # violation, INCLUDING the Embed SDK cases. So the upward half of the
        # boundary — "the Embed SDK contains no chain concept" — is exercised
        # against synthetic trees here as well as against the real package below.
        #
        # It runs AFTER the checkouts and with CODETRACER_SRC set, because two
        # of its 28 cases need the sibling repository and SKIP without it: the
        # real-Embed scan, and the cross-repository assertion that both halves
        # of the boundary use the same CHAIN_TOKENS list. Run before the
        # checkouts this step reports "26 case(s), 2 skipped" and the one check
        # that catches the two lists drifting apart never executes anywhere.
        # It still runs before the Nim install, so a crossed import is reported
        # without waiting on a toolchain.
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
        run: ci/test/client-sdk-boundary-test.sh

      - name: Client SDK import boundary — against the REAL Embed SDK
        # --require-embed: with the checkout above in place, "no Embed SDK
        # source" is a failure rather than a skip, so this step cannot pass by
        # quietly not running.
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
        run: ci/test/client-sdk-boundary.sh --require-embed

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          # NOT optional, despite what the action's README says. See the
          # "THE THREE NIM JOBS" note at the top of this file: an absent
          # token makes the action send `Authorization: Bearer ` and get a
          # 401, which it then treats as a tag list.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Client SDK — consumer-side conformance suite
        # No Embed SDK on the Nim path, deliberately: the chain half compiling
        # without a debugger is the layering (Client-SDK.md §5).
        run: nim c -r --hints:off tests/tclientsdk.nim

      - name: Client SDK — the handoff, against the real Embed SDK
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
          ISONIM_SRC: ${{ github.workspace }}/isonim
          NIM_EVERYWHERE_SRC: ${{ github.workspace }}/nim-everywhere
        run: ci/test/embed-handoff-test.sh --require

  # VD.1 — the review brief and the quality gate. Its own job because it needs
  # neither Nim nor a browser: all three verifications are decisions over the
  # brief, the view list and the recorded findings ledger, so they run in
  # seconds and report a stale brief or an ungated view without waiting on a
  # toolchain.
  #
  # NOT here, and deliberately: the capture harness itself. `capture.mjs` needs
  # the Nim static exporter, a Playwright browser and the pinned capture
  # environment, none of which exist on a bare `setup-node` runner. That half
  # now runs in `visual-design-canary` below, on a Nix runner. What stays here
  # is everything that is a decision over the brief, the view list and the
  # recorded ledger, so a stale brief or an ungated view is reported in seconds
  # without waiting on a toolchain.
  visual-design:
    runs-on: ubuntu-latest
    # Job-level, not step-level: `check-tokens-selftest.mjs` drives the REAL
    # checker, so it needs the same design system the checker does. Setting it
    # on one step and not the other would leave the self-test grading a C3 that
    # could not run.
    env:
      DESIGN_SYSTEM_SRC: ${{ github.workspace }}/.design-system
    steps:
      - uses: actions/checkout@v4
        with:
          # B4 compares each `ledger@<rev>:` citation against the ledger AS IT
          # STOOD at the revision cited, which it reads out of git history. A
          # shallow clone has none, so B4 fell back to bare revision-currency
          # and failed all five citations that name an earlier round — over a
          # tree where all five are SAFE-RESTAMP (`just design-citations`
          # prints the two texts side by side and classifies them).
          #
          # This is NOT relaxing B4. The fallback is the check refusing to
          # answer a question it cannot see the evidence for, and it says so in
          # the failure text; the fix is to give it the evidence. With history
          # present B4 compares meanings and a citation whose finding really
          # DID change still fails.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # C3 resolves the rhythm roles to numbers out of the design system's DTCG
      # source, and reports NOT-RUN-IS-NOT-A-PASS when it cannot read it. On a
      # developer's machine it finds a `../codetracer-design-system` sibling; in
      # `nix develop` it comes from the flake input. This job is bare
      # ubuntu-latest + setup-node, which has neither — so C3 had never once
      # executed, and failed closed the first time it reached a runner.
      #
      # The revision is READ OUT OF flake.nix rather than written here, so the
      # design system stays pinned in exactly one place. A second literal would
      # be a second pin to drift.
      - name: Resolve the design-system pin from flake.nix
        id: ds
        run: |
          set -euo pipefail
          rev="$(sed -n 's|.*github:metacraft-labs/codetracer-design-system/\([0-9a-f]\{40\}\)".*|\1|p' flake.nix)"
          # An empty match here would check out the DEFAULT BRANCH and turn a
          # pinned input into a moving one, silently. Fail instead.
          if [ -z "$rev" ]; then
            echo "::error::could not read the codetracer-design-system rev from flake.nix" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$rev" | wc -l)" -ne 1 ]; then
            echo "::error::flake.nix names more than one codetracer-design-system rev" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "design system pinned at $rev"

      - name: Check out the pinned design system
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/codetracer-design-system
          ref: ${{ steps.ds.outputs.rev }}
          path: .design-system
          filter: blob:none

      - name: Every named view has an expected-elements block
        # verify_brief_has_expectation_block_per_view. Also fails when the
        # brief's generated section has drifted from expectations.mjs, so a
        # view added to views.mjs cannot land without its block.
        run: node tools/capture/check-brief.mjs

      # ── VD.2 — the foundations pass ───────────────────────────────────────
      # These need neither Nim nor a browser either: both are decisions over
      # client/src/design_system/web.tokens.json and the Layer 2 sources. The
      # ONE check that does need a build — D1/D2, the shipped-CSS cross-check —
      # reports itself NOT RUN here rather than passing vacuously, and `just
      # design-check` runs it with --require-built locally and in the deploy
      # build, where a dist/ exists.
      - name: No Layer 2 view references a raw value or a brand primitive
        # verify_no_raw_values_in_views, plus the Design-System.md §4.1 rule:
        # every bkLiteral names a divergence row and every row is backed by a
        # literal. Also asserts the rhythm roles are separated (C3), which is
        # the property that stops one spacing step doing two jobs again.
        run: node tools/design/check-tokens.mjs

      - name: The token lint DECIDES — every rule, against the real source
        # A checker never seen to fail has not been demonstrated. This EDITS
        # client/src/**, runs the real checker, asserts it goes red and names
        # the planted value, then restores the file and verifies the SHA-256.
        # The control — the unmodified tree passing — runs before and after.
        run: node tools/design/check-tokens-selftest.mjs

      - name: The working tree is unchanged by the self-test
        # The self-test restores what it plants in a `finally` and checks the
        # digest itself. This is the independent confirmation: if a restore
        # ever failed, CI must not carry on against a mutated tree.
        run: git diff --exit-code

      - name: The gate decides — every condition independently blocks
        # verify_gate_definition_is_machine_checkable. Synthetic ledgers, one
        # per condition, plus the four fail-closed paths. Since VD.2 it also
        # covers `--foundations`: that the narrowed gate still fails on a
        # foundations defect, does NOT fail on a page-level one, reports the
        # full gate alongside itself, and leaves G2/G4/G5 unrelaxed.
        run: node tools/capture/gate-selftest.mjs

      - name: The deliberate break is detected
        # verify_deliberate_break_is_detected, re-graded from every recorded
        # round. Applying a break needs the Nim exporter, a browser and six
        # review sub-agents, so CI grades the recorded reviewer output rather
        # than re-running the round.
        run: |
          for round in reviews/break-round-*.json; do
            echo "── $round"
            node tools/capture/break-check.mjs --grade "$round"
          done

      - name: The findings ledger is well-formed
        # The gate is EXPECTED to fail while no page has been taken to it; what
        # must not happen is a malformed ledger passing unnoticed. `--json` and
        # a schema-problem count of zero is the assertion.
        run: |
          node tools/capture/gate.mjs --json > gate.json || true
          node -e '
            const g = require("./gate.json");
            if (g.schemaProblems.length) {
              console.error("ledger schema problems:");
              for (const p of g.schemaProblems) console.error(`  [${p.code}] ${p.msg}`);
              process.exit(1);
            }
            console.log(`ledger OK; gate ${g.passing}/${g.scope} passing (revision ${g.ledgerRevision})`);
          '

  # VD.0 — the TIER-1 DETERMINISM CANARY, in the pinned capture environment.
  #
  # This is the job the tier-1 verdict comes from, and it is the only place one
  # can come from. `visual-design` above runs on bare Node and cannot produce
  # one; a developer's machine can run the canary but not conclude from it —
  # darwin rasterises through the host compositor, which no derivation pins, so
  # `check-canary.mjs` marks a darwin run `advisory` however pinned its inputs
  # are. LINUX CI IS THE ENVIRONMENT THAT HAS TO REPRODUCE ITSELF, which is all
  # tier 1 asks for (Methodologies/visual-design-iteration.md §"Tier 1").
  #
  # A Nix runner, not ubuntu-latest + setup-node: the whole point is that the
  # browser build and the font set come from `tools/capture/capture-env.nix`
  # rather than from whatever the runner image happens to ship. The
  # `metacraft-labs/nixos-modules` setup + `eph-linux-x64` is the same pairing
  # the Cloudflare Pages deploy uses.
  #
  # WHAT THIS JOB ESTABLISHES, precisely: that two consecutive captures of the
  # canary set, in separate processes, inside the pinned environment, on
  # x86_64-linux, are byte-identical — and therefore that a tier-2 perceptual
  # baseline stored from this environment can be believed. It does NOT
  # establish that a hash here matches a hash from a developer's machine, and
  # nothing in the harness claims it does: the environment id in
  # `screenshots/canary/status.json` records the system, so a comparison across
  # two systems is visible as one rather than reported as a regression.
  visual-design-canary:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What the pinned capture environment fixes
        # Printed before anything is captured, so the run's log carries the
        # exact browser bundle, font set, node and renderer-flag digest every
        # hash below is conditional on — and the content-hash id that changes
        # when any of them moves.
        run: nix run .#capture-env -- --print-pin

      - name: Install the pinned Playwright npm package
        # The eph-* runners carry no node/npm, so npm comes from the flake.
        # `npm ci` (lockfile-exact) and no browser download: the browsers come
        # from the store, and lib/pinned-env.mjs FAILS the environment if the
        # npm version and the bundle's version disagree.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: nix develop .#capture --command npm --prefix tools/capture ci --no-audit --no-fund

      - name: The pinned-environment detector's negative controls
        # Every way of CLAIMING the environment without being in it: a bare
        # `VD0_PINNED_ENV=nix`, a browsers path outside the store, a
        # FONTCONFIG_FILE that quietly points at the host's, a Playwright
        # version skewed against the bundle, a Chromium that would launch from
        # somewhere else. Plus the positive control, and the darwin caveat.
        # Runs BEFORE the canary: a detector that can be fooled makes the
        # verdict below worthless.
        run: nix run .#capture-env -- node tools/capture/env-selftest.mjs

      - name: Build the site the capture is taken over
        # In place, at client/dist, because that is the path every tool below
        # defaults to. The exporter is a pure function of a fixed seed, so the
        # bytes handed to the browser are fixed before the capture starts;
        # capture.mjs records the tree digest so "the fixture changed" stays
        # distinguishable from "the renderer changed".
        run: |
          nix develop .#ci --command bash -c \
            'cd client && nim c -r --mm:orc -d:isServer -d:release --hints:off src/static_export.nim'

      - name: Tier 1 — the determinism canary, byte-identical
        # verify_canary_capture_is_byte_identical. Two captures of the canary
        # set in two separate processes; the assertion is byte-identity, not a
        # threshold, because at this scope anything less exact is not answering
        # the question.
        run: nix run .#capture-env -- node tools/capture/check-canary.mjs --no-build

      - name: The tier-1 verdict is USABLE — not advisory, not incoherent
        # verify_canary_failure_invalidates_the_baselines, from the other side.
        # This step is what makes the job non-vacuous: it fails when the canary
        # failed, when the verdict is advisory (which is what a run outside the
        # pinned environment produces), when it is stale, and when its own
        # fields contradict each other. If the pinned environment ever stops
        # being in effect here, this goes red instead of the canary quietly
        # becoming a host measurement.
        #
        # `nix run .#capture-env -- node`, NOT bare `node`: the eph-* runners
        # carry no node at all, which is why the step above installs npm from
        # the flake. Written bare, this step died with `node: command not
        # found` (rc 127) — the job's own non-vacuity guard, unable to run.
        # Both scripts here are pure readers of files the steps before them
        # wrote, so running them inside the pinned environment changes nothing
        # about what they decide; it only gives them an interpreter.
        run: nix run .#capture-env -- node tools/capture/require-deterministic.mjs

      - name: Full regeneration, and the named view list is covered
        # verify_capture_covers_named_view_list + verify_full_regen_removes_stale_images.
        # A full regeneration cleans first, so a renamed or deleted view leaves
        # no stale image; check-coverage then decides both halves — every
        # inventory entry named, and every image on disk corresponding to a
        # named view.
        run: |
          nix run .#capture-env -- node tools/capture/capture.mjs --no-build
          nix run .#capture-env -- node tools/capture/check-coverage.mjs

      - name: The ingest tool refuses what a hand would write
        # `just review-ingest-selftest`. It belongs in THIS job and not beside
        # gate-selftest in `visual-design`, for one reason: its base case hashes
        # a real capture (screenshots/debugger__wide__dark.png), and it refuses
        # to report green over an absent subject rather than skipping. So it can
        # only run where the regeneration above has just produced the images.
        #
        # Every case runs against a synthetic ledger under its own temp dir, so
        # this step's verdict does not depend on reviews/ledger.json agreeing
        # with the screenshots the step before it just rewrote — which is the
        # whole reason it is safe to put here.
        run: nix run .#capture-env -- node tools/capture/ingest-selftest.mjs

      - name: The VD.0 verifications, end to end
        # selftest.mjs re-runs all four against a throwaway output directory,
        # including the negative control that plants a stale image. In the
        # pinned environment its canary section is a tier-1 verdict rather than
        # the advisory one a developer sees.
        run: nix run .#capture-env -- node tools/capture/selftest.mjs

      - name: Keep the verdict and the manifest
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-canary
          # The verdict and the manifests, not the 64 images: what a later run
          # needs from this one is WHICH environment produced the hashes.
          path: |
            screenshots/canary/status.json
            screenshots/manifest.json
          retention-days: 30

  # M12 — BlockTracer's own ViewModel layer (Front-End-Architecture.md §3).
  # Two halves, and the split is the layering rather than a convenience: the
  # Tier-1 suite runs with NO debugger on the Nim path, and the seam suite runs
  # with the real Embed SDK so the wire spellings the panes parse cannot drift
  # from the ones this layer emits.
  viewmodels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Embed SDK
        id: pin
        run: grep -E '^[A-Z_]+=' ci/embed-sdk-pin.env >> "$GITHUB_OUTPUT"

      - name: Check out the pinned IsoNim
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.ISONIM_REPO }}
          ref: ${{ steps.pin.outputs.ISONIM_REF }}
          path: isonim
          filter: blob:none

      - name: Check out the pinned nim-everywhere
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.NIM_EVERYWHERE_REPO }}
          ref: ${{ steps.pin.outputs.NIM_EVERYWHERE_REF }}
          path: nim-everywhere
          filter: blob:none

      - name: Check out the pinned CodeTracer Embed SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.CODETRACER_REPO }}
          ref: ${{ steps.pin.outputs.CODETRACER_REF }}
          path: codetracer
          filter: blob:none
          sparse-checkout: |
            src/frontend
            ci/test
          sparse-checkout-cone-mode: false

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          # NOT optional, despite what the action's README says. See the
          # "THE THREE NIM JOBS" note at the top of this file: an absent
          # token makes the action send `Authorization: Bearer ` and get a
          # 401, which it then treats as a tag list.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tier 1 — every §14 chain row, established from a mock chain
        # No Embed SDK on the path: BlockTracer's own ViewModels are chain-aware
        # and need no debugger to be tested, which is the same layering claim
        # tests/tclientsdk.nim makes one layer down.
        env:
          ISONIM_SRC: ${{ github.workspace }}/isonim
          NIM_EVERYWHERE_SRC: ${{ github.workspace }}/nim-everywhere
        working-directory: client
        run: nim c -r --mm:orc --hints:off tests/test_chain_viewmodels.nim

      - name: The degraded-state seam, against the real Embed SDK
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
          ISONIM_SRC: ${{ github.workspace }}/isonim
          NIM_EVERYWHERE_SRC: ${{ github.workspace }}/nim-everywhere
        run: ci/test/viewmodel-seam-test.sh --require

      # M8a — the other half of the debug route. The route itself is checked
      # with no debugger on the path (the `debug-route` job below); these two
      # need the real Embed SDK and so belong here, where it is already
      # checked out at the pin.
      - name: The debug panes, over the Embed SDK's own five ViewModels
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
          ISONIM_SRC: ${{ github.workspace }}/isonim
          NIM_EVERYWHERE_SRC: ${{ github.workspace }}/nim-everywhere
        run: ci/test/debug-panes-test.sh --require

      - name: The vendored layout model still agrees with upstream
        env:
          CODETRACER_SRC: ${{ github.workspace }}/codetracer
        run: |
          ci/test/layout-model-vendor.sh --require
          ci/test/layout-model-vendor-test.sh

  # M8a/M8b — the `/{chain}/tx/{hash}/debug` route, with NO debugger on the Nim
  # path. The route, the arrangement walked off CodeTracer's LayoutNode, the
  # five pane renderers, the static source renderer, §7.0's
  # availability-decides-the-landing rule and the stored crawl-surface
  # baseline: all of it is checked over a demo tree the suite generates
  # in-process, and none of it needs a replay engine. The halves that DO need
  # one are steps on the `viewmodels` job above.
  #
  # It runs inside `nix develop .#ci` rather than on a bare Nim toolchain
  # because the pages it renders inline the design-system token layer, and
  # DESIGN_SYSTEM_SRC comes from the flake's pinned input. A second checkout
  # here would be a second pin for the same bytes.
  debug-route:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tier 1 — the debug route, the arrangement and the source renderer
        run: nix develop .#ci --command bash -c 'cd client && just test-debug-route'

      - name: The static export still round-trips with the new route in it
        run: nix develop .#ci --command bash -c 'cd client && just test-export'

      # THE FIVE SUITES THAT RAN NOWHERE.
      #
      # `cd client && just test` names seven suites; this job ran two of them and
      # no other job ran any. The five below were green locally and dark in CI —
      # including `test-entry-state`, which exists specifically to stop the
      # `Nargo.toml` defect coming back, and `test-chain-provenance`, which is
      # what keeps synthetic data from asserting itself over a real capture.
      #
      # They are run as `just test` rather than five named steps, deliberately:
      # a named list here would be a third place to add a suite to, and the
      # second one is what went wrong. `ci-coverage.sh` reads the same aggregate
      # this runs, so a suite added to it is covered on the next run by both.
      - name: Every suite in `just test`, including the five that ran nowhere
        run: nix develop .#ci --command bash -c 'cd client && just test'

      - name: The two vendored-layout gates no job named
        # `flow-layout-vendor.sh` and its self-test guard the Omniscience layout
        # arithmetic against upstream. `layout-model-vendor.sh` — the same
        # pattern, one file over — was already in the `viewmodels` job; these two
        # were written beside it and never wired up.
        run: |
          nix develop .#ci --command bash -c '
            bash ci/test/flow-layout-vendor.sh &&
            bash ci/test/flow-layout-vendor-test.sh'

  # ── Journey conformance ────────────────────────────────────────────────────
  # Spec claims, judged in a browser, over the artefact this repository DEPLOYS.
  #
  # WHY THIS JOB EXISTS. Every other job here asserts one component's contract:
  # the route classifies, the renderer emits the class, the exporter round-trips,
  # the tokens resolve. Four user-visible defects passed all of them, because no
  # check anywhere stated an end-to-end claim — and the two the debug route lost
  # were invisible to `test-debug-route`'s 115 cases specifically because those
  # cases drive `renderToString`, and what a visitor loads is that markup plus
  # `client/hydrate/hydrate.js` re-rendering every pane on top of it.
  #
  # WHY IT BUILDS WITH NIX RATHER THAN WITH `just export-hydrated`. `nix build
  # .#default` is what `deploy-cloudflare-pages.yml` uploads. Running the local
  # exporter here would test a build no visitor is served, and this repository
  # has already been bitten by driving the wrong one of the two.
  #
  # WHY IT IS ITS OWN JOB. `visual-design-canary` owns the pinned browser for
  # PIXELS and asserts byte-identity between two runs; this asserts BEHAVIOUR and
  # must be free to click things, which would invalidate that job's determinism
  # claim. Sharing the runner would couple a screenshot baseline to a step
  # sequence.
  journeys:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What the pinned browser environment fixes
        run: nix run .#capture-env -- --print-pin

      - name: Install the pinned Playwright npm package
        # ONE pin for the whole repository. `tools/journeys` resolves playwright
        # out of `tools/capture/node_modules` rather than declaring a second
        # dependency, because a skewed pair works and silently behaves
        # differently — which is why lib/pinned-env.mjs refuses a skew.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: nix develop .#capture --command npm --prefix tools/capture ci --no-audit --no-fund

      - name: Build the site the deploy uploads
        # `.#default` and not the local exporter: hydrate/build.sh --require runs
        # first, so a tree that cannot produce the bundle fails HERE rather than
        # serving the pre-hydration page and passing.
        run: nix build .#default

      - name: Stage it, and copy the replay engine to its own origin
        # §5.1: `new Worker(scriptURL)` requires a same-origin script, so the
        # engine is COPIED rather than linked — the same step, from the same
        # script, that deploy-cloudflare-pages.yml runs.
        run: |
          rm -rf .journey-site && mkdir -p .journey-site
          cp -R result/. .journey-site/
          chmod -R u+w .journey-site
          # INTO THE CACHE, and let the runner stage from there.
          #
          # The engine used to be fetched straight into `.journey-site/`, and the
          # selftest step below then reported NEVER RAN for its two hydration
          # arms: those arms rebuild into `client/dist`, which had no engine, so
          # their journeys SKIPPED and emitted no assertions to match against.
          # The harness was right to call that "never ran" rather than a kill —
          # an arm whose journey did not execute has demonstrated nothing — but
          # the arms were measuring the wrong tree.
          #
          # `lib/engine.mjs` copies the cache into whichever `--dist` it is given,
          # so one fetch now serves both the selftest's `client/dist` and the
          # verdict's `.journey-site`. It is fetched once because it is 18 MB.
          ./client/hydrate/fetch-engine.sh client/.replay-engine-cache

      # THE WORKING TREE IS NOT THE NIX BUILD, and the selftest below uses the
      # working tree.
      #
      # `nix build .#default` above runs `hydrate/build.sh` INSIDE the
      # derivation, so the bundle it produces lives in the store and lands in
      # `result/`. Nothing puts one at `client/hydrate/hydrate.js`. The selftest
      # rebuilds the exporter locally with `-d:hydrationBundle=/assets/hydrate.js`
      # (it must — that define is what makes a debug page carry the script tag
      # the journeys assert on), and `installHydrationBundle` then refuses to
      # emit a page naming a bundle that was never produced.
      #
      # On the first real-runner execution of this job that is exactly what
      # happened, and the harness reported it correctly rather than scoring six
      # kills over a tree that does not build:
      #
      #     the unmutated tree does not build; nothing below would mean anything
      #
      # That is the control arm doing its job. Build the bundle in the tree the
      # selftest actually compiles against.
      - name: Build the hydration bundle in the working tree
        run: nix develop .#capture --command bash -c 'cd client && just hydrate'

      - name: Do the journeys bite?
        # BEFORE the verdict, never after. Six mutations in real product source,
        # each aimed at one named assertion. A suite whose assertions cannot fail
        # would otherwise report a clean sweep over anything at all — and this
        # step runs the local exporter, so it also proves that build still works.
        #
        # `.#capture` and not `.#capture-env`: the arms REBUILD, so this needs the
        # Nim toolchain as well as the pinned browser, and `.#capture` is the
        # shell that is "the same environment, PLUS the Nim toolchain" for exactly
        # this reason. Measured on the first real run of this job: under
        # `capture-env` alone every arm reported DID-NOT-BUILD, because `nim` was
        # not on PATH. The harness was right to call that "never ran" rather than
        # a kill — an arm that cannot compile has demonstrated nothing.
        run: |
          nix develop .#capture --command \
            vd0-capture-env node tools/journeys/selftest.mjs

      - name: The journeys, over the deployed artefact
        run: |
          nix run .#capture-env -- node tools/journeys/run.mjs \
            --dist .journey-site --json journey-report.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-report
          path: journey-report.json
          if-no-files-found: warn
