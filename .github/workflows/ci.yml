name: ci

# THE BRANCHES THIS REPOSITORY ACTUALLY SHIPS FROM.
#
# This read `branches: [main]` until 2026-09-01. `main` exists and was 178
# commits behind `dev` — tip "VD.0: visual-design capture harness (pinned
# container UNVALIDATED)" — and work lands on `dev` by direct push. So every job
# below had not run on the mainline for 178 commits: the only trigger still
# firing was `pull_request`, and a branch that nobody opens a PR from is a branch
# with no CI at all.
#
# The list must equal `deploy.yml`'s, because those are the branches that reach
# a visitor. `ci/test/ci-coverage.sh` asserts exactly that and fails on a branch
# that is deployed and ungated — and on a trigger naming a branch that does not
# exist, which is what made this invisible: dead trigger and working trigger read
# identically in YAML.
#
# ---------------------------------------------------------------------------
#
# THE THREE NIM JOBS — ONE TOOLCHAIN, AND IT COMES FROM THE FLAKE.
#
# `contract`, `client-sdk` and `viewmodels` used to install Nim with
# `jiro4989/setup-nim-action@v2`, pinned to the floating range "2.2.x". All
# three failed their `Install Nim` step on the first mainline run, and it was
# ONE cause, not three. Recorded because the log named the wrong thing:
#
#   The action resolves an `x`-ranged version by asking the GitHub API for
#   nim-lang/Nim's tags, and sends the header unconditionally:
#
#       curl -H "Authorization: Bearer ${repo_token}" .../git/refs/tags | jq -r '.[].ref'
#
#   `repo-token` has NO default and no job passed one, so the header went out as
#   a literal `Authorization: Bearer ` and GitHub answered `401 Bad
#   credentials` — a 112-byte JSON object. Then, in sequence: `jq -r '.[].ref'`
#   died indexing a string; it died INSIDE A PIPELINE, so `set -eu` never saw it
#   (the status is `sed`'s, and `sed` succeeds on empty input); the version
#   resolved to the empty string; the download URL 404'd; and `tar` reported
#   `This does not look like a tar archive`. A corrupt tarball reported for what
#   was an unauthenticated API call. An ABSENT header would have worked at the
#   unauthenticated rate limit — an EMPTY one is refused outright, so the
#   action's README ("It works without setting this parameter") is wrong for any
#   `2.n.x` version.
#
# Passing `repo-token` fixes that failure, and it was verified to: `contract`
# went green on a runner with one line. It is NOT what this file does, because
# it leaves two worse problems standing:
#
#   * "2.2.x" IS A FLOATING RANGE. It resolves at runtime against whatever
#     nim-lang/Nim has tagged, so CI could pass on a different compiler from the
#     one flake.lock pins and every developer uses. A toolchain that drifts is
#     the thing the flake exists to prevent.
#   * A THIRD-PARTY ACTION IN THE TOOLCHAIN PATH is supply-chain surface, and it
#     is surface this repository already pays nothing for anywhere else.
#
# So all three now do what `debug-route`, `journeys`, `visual-design-canary` and
# the Cloudflare deploy already did: `nix develop .#ci --command`, on the same
# self-hosted label, with Nim from flake.lock (2.2.10, pinned, no API call and
# no download). Measured before the switch: the flake's shell and the range
# resolved to the SAME compiler, so this pins what was already true rather than
# changing it.
#
# IT ALSO REMOVED THE THREE SIBLING CHECKOUTS. `.#ci` exports ISONIM_SRC,
# NIM_EVERYWHERE_SRC, CODETRACER_SRC and DESIGN_SYSTEM_SRC from pinned flake
# inputs, so the Embed SDK / IsoNim / nim-everywhere checkouts these jobs used
# to do by hand are redundant — and the flake input is the WHOLE tree, which
# dissolves a second defect: the hand-rolled checkout was sparse on
# `src/frontend` only, and `src/frontend/.../flow_vm.nim` imports
# `../../../common/flow_mode_wire`, so both cross-repo suites died with `cannot
# open file` the moment they got far enough to compile. flake.nix's codetracer
# rev and `ci/embed-sdk-pin.env`'s CODETRACER_REF are required to be equal and
# are (8d1c84a); the flake is now the only one of the two these jobs read.
#
# Why it took 178 commits to see any of it: these three jobs were the only ones
# taking a toolchain from the network rather than from the flake, and no run of
# them reached a runner in that time.
on:
  push:
    branches: [dev, staging, live]
  pull_request:
  # THE LANE THAT CANNOT BE EVICTED. See the concurrency block below — this
  # trigger exists so that a run can be produced which no push and no PR is
  # able to collapse. `ci-coverage-clock.yml` is what fires it on a clock; it
  # is also the handle for forcing a mainline verdict by hand:
  #
  #     gh workflow run ci.yml --ref dev
  workflow_dispatch:

# ONE RUN PER BRANCH. Superseded runs are cancelled.
#
# Six of the eight jobs below need the self-hosted `eph-linux-x64` pool, which
# runs a handful of jobs at a time, and a full run takes 10-15 minutes. Work
# lands on `dev` by direct push from several agents at once — measured on
# 2026-09-01, five pushes inside twelve minutes. Without this block every one of
# those pushes started a complete run and none of them stopped, so the queue
# grew faster than the pool drained and runs for long-superseded commits sat in
# front of the newest one. Observed directly: five CI runs queued at once, the
# newest of them unable to start any job for sixteen minutes.
#
# WHAT THIS TRADES. Intermediate commits no longer get their own verdict — the
# gate is the branch TIP rather than every commit on the way to it. That is a
# real loss and it is recorded as one. It is chosen because the alternative is
# not "every commit is gated": it is "no commit is gated in useful time", which
# is the state this was written in. A backlog that never drains reports nothing
# about any commit, and a suite nobody can get a verdict from is the same
# absence of signal that let the `main` trigger rot for 178 commits — arrived at
# from the other direction.
#
# `github.ref` and not `github.sha`: the point is to collapse pushes to the SAME
# branch. Two branches still run concurrently.
#
# ---------------------------------------------------------------------------
#
# WHAT THE PARAGRAPHS ABOVE GOT WRONG, MEASURED ON 2026-09-03.
#
# The trade they describe is "the gate is the branch TIP rather than every
# commit". That is the trade this block makes when a run SURVIVES to a verdict.
# It is not the trade it actually made. Of the last 25 `ci` runs on `dev`:
# 21 CANCELLED, 3 failed, 0 successful, and the last run to reach any verdict
# at all was ~4.5 hours old and red. No commit landed that day had a CI verdict
# of any kind.
#
# The mechanism, and it is not the one the paragraphs above assume. They assume
# the newest run survives and the superseded ones die. On a SATURATED pool that
# is false: six of the eight jobs here need `eph-linux-x64`, a full run is
# 10-15 minutes and `journeys` alone is bounded at 150, while pushes from
# several agents land every few minutes. So the newest run is still PENDING —
# it has not placed a single job on a runner — when the next push evicts it.
# `cancel-in-progress` does not wait for a run to start being useful. The
# branch tip is never gated either, because there is always a newer tip before
# the current one can be judged. Cancelling to protect the queue and cancelling
# away 100% of the coverage are the same setting; which one you get depends on
# whether pushes are slower than a run, and here they are not.
#
# THIS IS CODETRACER'S DEFECT, and the remedy is ported from there rather than
# reinvented: keying concurrency on the branch drained a 46-deep queue and cost
# 100% of mainline coverage, and the fix was A SECOND LANE that no push and no
# PR can produce. It is proven by controlled comparison — 31 jobs created for
# the dispatch against 0 for a push in the same minute.
#
# HOW THE TWO LANES ARE KEPT DISJOINT. A push always has `github.ref` =
# `refs/heads/<branch>`; a pull request always has `refs/pull/<n>/merge`.
# NEITHER can ever equal the string `ci-coverage-<name>`, so the dispatch lane's
# group is unreachable from the push and PR lanes by construction, not by
# convention. They therefore cannot evict each other in either direction.
#
# `cancel-in-progress` is FALSE for the dispatch lane and true for the others.
# A scheduled coverage run that a later scheduled coverage run could cancel
# would reproduce this whole defect inside the lane written to escape it. The
# pile-up that `false` risks is handled where it belongs — `ci-coverage-clock.yml`
# does not dispatch while a coverage run is already in flight — rather than by
# a setting that cannot tell "superseded" from "not started yet".
#
# THE CLOCK IS IN ANOTHER FILE, DELIBERATELY. GitHub fires `schedule:` only from
# the DEFAULT branch, using that branch's copy of the workflow. Putting a
# `schedule:` on this file would tie mainline coverage to whichever branch is
# default — today that is `dev`, so it would appear to work, and it would give
# `staging` and `live` nothing while looking correct in review. The clock names
# the refs it wants explicitly instead; see `ci-coverage-clock.yml`.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-coverage-{0}', github.ref_name) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Does every suite this repository has actually run, on every branch it ships
  # from? Nothing measured that until 2026-09-01, and the answer was no on both
  # counts. Cheapest job here and first, because a red anywhere below means
  # nothing if the surface has holes in it.
  ci-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Step 4 resolves the trigger's branch names against real refs. A
          # shallow clone has none, and the check would SKIP — which this job
          # reports as a skip, not a pass, but it is better to just have them.
          fetch-depth: 0

      - name: Every suite runs, on every branch we deploy
        run: bash ci/test/ci-coverage.sh

      - name: And the guard bites — four planted holes, four reports
        run: bash ci/test/ci-coverage-test.sh

  # The two gates that stand between a build and production, and the proof that
  # either of them can go red.
  #
  # WHY THIS JOB EXISTS AT ALL. `tools/deploy/check-assets-selftest.mjs` — 322
  # lines, eleven arms, both production incidents reproduced as fixtures — was
  # referenced by NOTHING in this repository and had never run in CI. The
  # deploy gate's own proof-of-bite was dead code, so the only evidence that
  # `check-assets.mjs` could fail was that someone had once watched it.
  #
  # `ci-coverage.sh` did not catch it because it enumerates `ci/test/*.sh` and
  # `client/Justfile`'s aggregate, and a selftest under `tools/` is in neither
  # list. That is a real gap in the coverage guard rather than in this job, and
  # it is left to the guard's owner; this job closes the immediate hole.
  #
  # `ubuntu-latest` and plain node: both selftests are pure Node with no repo
  # toolchain dependency, and a gate that needs the Nix runner to prove it can
  # fail is a gate that gets skipped when the runner is busy.
  deploy-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, matching flake.nix's `nodejs_22`. These GitHub-hosted jobs
          # deliberately do NOT use the Nix shell (a gate that needs the busy
          # Nix runner to prove it can fail is a gate that gets skipped), so the
          # version is pinned twice and the two must not drift.
          node-version: "22"

      - name: Does the asset gate bite? (existence — every reference resolves)
        # Eleven arms, each a single mutation of a synthetic publish tree, each
        # asserting that the check WRITTEN for it is the one that goes red.
        run: node tools/deploy/check-assets-selftest.mjs

      - name: Does the freshness gate bite? (provenance — the bytes are this commit's)
        # Nineteen arms. Three of them require the gate to stay GREEN over a
        # legitimately-changed world — a new upstream engine, a new capture, a
        # few KB of engine drift — because a gate that reddens on a normal
        # deploy is a gate that gets switched off, and then the staleness it
        # was written for ships with it nominally in place.
        run: node tools/deploy/check-freshness-selftest.mjs

      - name: Does the deploy watchdog refuse the four worlds it must refuse?
        # `deploy-requeue.yml` spends a scarce shared runner pool with no human
        # in the loop, so the arms that matter are the REFUSALS: a genuine
        # build failure, a supersede, an unreadable branch tip, and an
        # exhausted bound. The last pinned assertion runs the decision to a
        # fixed point and proves the retry loop terminates rather than arguing
        # that it does.
        run: node tools/ci/requeue-decide-selftest.mjs

      # ── the chain capture tooling, for this job's own stated reason ──────
      #
      # Same hole, same shape. `tools/chain/`'s three selftests — 124 counted
      # assertions between them — were referenced by nothing: not by
      # `just test`, not by any job here, and not by `ci-coverage.sh`, whose
      # enumeration reaches `ci/test/*.sh` and `client/Justfile` and nothing
      # under `tools/`. They cover decisions that CANNOT be rechecked after
      # the fact, because a capture is unrepeatable: an Aztec transaction body
      # is hard-deleted about half an hour after it lands, so a rule that
      # misfiles a catch does not cost a retry, it costs the transaction.
      #
      # All three are offline and toolchain-free, which is why they belong in
      # THIS job rather than behind the Nix runner.
      - name: Does the replay verdict rule bite? (which outcome a driver run is)
        # Ten cases over recorded driver output. The three that have already
        # cost something are pinned as fixtures: a non-zero exit that is a
        # divergence and not a refusal, a refusal whose name was `unknown`
        # because the classifier was a suffix allowlist, and a detail field
        # that spent its whole budget on Node's preamble. Case 10 is the
        # three-state `artifacts` rule; case 11 refuses a runtime that
        # cannot resolve artifacts, which replays perfectly and records
        # nothing.
        run: node tools/chain/replay-selftest.mjs

      - name: Does the freeze gate refuse? (four checks, each re-asked of the chain)
        # 19 arms against a mock node. `frozen` is a conclusion the tool
        # reaches, not a flag a caller sets, and a gate that has never said no
        # is indistinguishable from no gate.
        run: node tools/chain/freeze-snapshot-selftest.mjs

      - name: Does the watch supervisor stop only when it means to?
        # 18 arms. A watch that exhausts its arms and a watch that dies with
        # its session both stop without saying they stopped, and rc 0 means
        # "this arm caught something" unless a capture target says otherwise.
        run: bash tools/chain/watch-chain-selftest.sh

  contract:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Conformance test suite
        # The package declares no third-party requires — stdlib only — so
        # `nimble test` resolves nothing over the network.
        run: nix develop .#ci --command nimble test -y

      - name: Demo generator emits a contract-conformant tree
        run: |
          nix develop .#ci --command bash -c '
            nim c -r --hints:off src/blocktracer_demo_gen.nim --out:demo-site &&
            nim c -r --hints:off src/blocktracer_validate.nim demo-site'

      - name: Determinism — regenerate and diff
        run: |
          nix develop .#ci --command bash -c '
            nim c -r --hints:off src/blocktracer_demo_gen.nim --out:demo-site-2'
          diff -r demo-site demo-site-2

  # M12a — @blocktracer/client. Its own job, because the boundary guard is the
  # cheap half (bash + awk, no toolchain) and must not wait on a Nim build to
  # tell someone their import crossed the layer.
  client-sdk:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      # No Embed SDK / IsoNim / nim-everywhere checkouts: `.#ci` exports
      # CODETRACER_SRC, ISONIM_SRC and NIM_EVERYWHERE_SRC from pinned flake
      # inputs, and the codetracer input is the WHOLE tree rather than a sparse
      # slice of it. See the note at the top of this file.

      - name: Client SDK import boundary — the guard's own self-test
        # Every rule driven against a synthetic tree carrying ONE deliberate
        # violation, INCLUDING the Embed SDK cases. So the upward half of the
        # boundary — "the Embed SDK contains no chain concept" — is exercised
        # against synthetic trees here as well as against the real package
        # below.
        #
        # It needs CODETRACER_SRC, because two of its 28 cases need the sibling
        # repository and SKIP without it: the real-Embed scan, and the
        # cross-repository assertion that both halves of the boundary use the
        # same CHAIN_TOKENS list. Without it this step reports "26 case(s), 2
        # skipped" and the one check that catches the two lists drifting apart
        # never executes anywhere. `.#ci` supplies it.
        run: nix develop .#ci --command ci/test/client-sdk-boundary-test.sh

      - name: Client SDK import boundary — against the REAL Embed SDK
        # --require-embed: with CODETRACER_SRC set, "no Embed SDK source" is a
        # failure rather than a skip, so this step cannot pass by quietly not
        # running.
        run: nix develop .#ci --command ci/test/client-sdk-boundary.sh --require-embed

      - name: Client SDK — consumer-side conformance suite
        # No Embed SDK on the Nim path, deliberately: the chain half compiling
        # without a debugger is the layering (Client-SDK.md §5). CODETRACER_SRC
        # being *set* does not put it on the path — nothing here imports it.
        run: nix develop .#ci --command nim c -r --hints:off tests/tclientsdk.nim

      - name: Client SDK — the handoff, against the real Embed SDK
        run: nix develop .#ci --command ci/test/embed-handoff-test.sh --require

  # VD.1 — the review brief and the quality gate. Its own job because it needs
  # neither Nim nor a browser: all three verifications are decisions over the
  # brief, the view list and the recorded findings ledger, so they run in
  # seconds and report a stale brief or an ungated view without waiting on a
  # toolchain.
  #
  # NOT here, and deliberately: the capture harness itself. `capture.mjs` needs
  # the Nim static exporter, a Playwright browser and the pinned capture
  # environment, none of which exist on a bare `setup-node` runner. That half
  # now runs in `visual-design-canary` below, on a Nix runner. What stays here
  # is everything that is a decision over the brief, the view list and the
  # recorded ledger, so a stale brief or an ungated view is reported in seconds
  # without waiting on a toolchain.
  visual-design:
    runs-on: ubuntu-latest
    # Job-level, not step-level: `check-tokens-selftest.mjs` drives the REAL
    # checker, so it needs the same design system the checker does. Setting it
    # on one step and not the other would leave the self-test grading a C3 that
    # could not run.
    env:
      DESIGN_SYSTEM_SRC: ${{ github.workspace }}/.design-system
    steps:
      - uses: actions/checkout@v4
        with:
          # B4 compares each `ledger@<rev>:` citation against the ledger AS IT
          # STOOD at the revision cited, which it reads out of git history. A
          # shallow clone has none, so B4 fell back to bare revision-currency
          # and failed all five citations that name an earlier round — over a
          # tree where all five are SAFE-RESTAMP (`just design-citations`
          # prints the two texts side by side and classifies them).
          #
          # This is NOT relaxing B4. The fallback is the check refusing to
          # answer a question it cannot see the evidence for, and it says so in
          # the failure text; the fix is to give it the evidence. With history
          # present B4 compares meanings and a citation whose finding really
          # DID change still fails.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, matching flake.nix's `nodejs_22`. These GitHub-hosted jobs
          # deliberately do NOT use the Nix shell (a gate that needs the busy
          # Nix runner to prove it can fail is a gate that gets skipped), so the
          # version is pinned twice and the two must not drift.
          node-version: "22"

      # C3 resolves the rhythm roles to numbers out of the design system's DTCG
      # source, and reports NOT-RUN-IS-NOT-A-PASS when it cannot read it. On a
      # developer's machine it finds a `../codetracer-design-system` sibling; in
      # `nix develop` it comes from the flake input. This job is bare
      # ubuntu-latest + setup-node, which has neither — so C3 had never once
      # executed, and failed closed the first time it reached a runner.
      #
      # The revision is READ OUT OF flake.nix rather than written here, so the
      # design system stays pinned in exactly one place. A second literal would
      # be a second pin to drift.
      - name: Resolve the design-system pin from flake.nix
        id: ds
        run: |
          set -euo pipefail
          rev="$(sed -n 's|.*github:metacraft-labs/codetracer-design-system/\([0-9a-f]\{40\}\)".*|\1|p' flake.nix)"
          # An empty match here would check out the DEFAULT BRANCH and turn a
          # pinned input into a moving one, silently. Fail instead.
          if [ -z "$rev" ]; then
            echo "::error::could not read the codetracer-design-system rev from flake.nix" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$rev" | wc -l)" -ne 1 ]; then
            echo "::error::flake.nix names more than one codetracer-design-system rev" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "design system pinned at $rev"

      - name: Check out the pinned design system
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/codetracer-design-system
          ref: ${{ steps.ds.outputs.rev }}
          path: .design-system
          filter: blob:none

      - name: Every named view has an expected-elements block
        # verify_brief_has_expectation_block_per_view. Also fails when the
        # brief's generated section has drifted from expectations.mjs, so a
        # view added to views.mjs cannot land without its block.
        run: node tools/capture/check-brief.mjs

      # ── VD.2 — the foundations pass ───────────────────────────────────────
      # These need neither Nim nor a browser either: both are decisions over
      # client/src/design_system/web.tokens.json and the Layer 2 sources. The
      # ONE check that does need a build — D1/D2, the shipped-CSS cross-check —
      # reports itself NOT RUN here rather than passing vacuously, and `just
      # design-check` runs it with --require-built locally and in the deploy
      # build, where a dist/ exists.
      - name: No Layer 2 view references a raw value or a brand primitive
        # verify_no_raw_values_in_views, plus the Design-System.md §4.1 rule:
        # every bkLiteral names a divergence row and every row is backed by a
        # literal. Also asserts the rhythm roles are separated (C3), which is
        # the property that stops one spacing step doing two jobs again.
        run: node tools/design/check-tokens.mjs

      - name: The token lint DECIDES — every rule, against the real source
        # A checker never seen to fail has not been demonstrated. This EDITS
        # client/src/**, runs the real checker, asserts it goes red and names
        # the planted value, then restores the file and verifies the SHA-256.
        # The control — the unmodified tree passing — runs before and after.
        run: node tools/design/check-tokens-selftest.mjs

      - name: The working tree is unchanged by the self-test
        # The self-test restores what it plants in a `finally` and checks the
        # digest itself. This is the independent confirmation: if a restore
        # ever failed, CI must not carry on against a mutated tree.
        run: git diff --exit-code

      # NOTE: "The gate decides" USED TO BE HERE and has moved to
      # `visual-design-canary`. `gate-selftest.mjs` hashes a real capture —
      # screenshots/debugger__wide__dark.png — to prove G2's "the exact image"
      # cases can tell a stale hash from a missing file, and `screenshots/` is
      # gitignored, so on a fresh checkout it is never there. It refuses to run
      # rather than skipping, which is correct, and it means this job could
      # never have run it. It is exactly the argument already written beside
      # `ingest-selftest.mjs` in the canary job — the twin was moved for this
      # reason and this one was left behind.

      - name: The deliberate break is detected
        # verify_deliberate_break_is_detected, re-graded from every recorded
        # round. Applying a break needs the Nim exporter, a browser and six
        # review sub-agents, so CI grades the recorded reviewer output rather
        # than re-running the round.
        run: |
          for round in reviews/break-round-*.json; do
            echo "── $round"
            node tools/capture/break-check.mjs --grade "$round"
          done

      - name: The findings ledger is well-formed
        # The gate is EXPECTED to fail while no page has been taken to it; what
        # must not happen is a malformed ledger passing unnoticed. `--json` and
        # a schema-problem count of zero is the assertion.
        run: |
          node tools/capture/gate.mjs --json > gate.json || true
          node -e '
            const g = require("./gate.json");
            if (g.schemaProblems.length) {
              console.error("ledger schema problems:");
              for (const p of g.schemaProblems) console.error(`  [${p.code}] ${p.msg}`);
              process.exit(1);
            }
            console.log(`ledger OK; gate ${g.passing}/${g.scope} passing (revision ${g.ledgerRevision})`);
          '

  # VD.0 — the TIER-1 DETERMINISM CANARY, in the pinned capture environment.
  #
  # This is the job the tier-1 verdict comes from, and it is the only place one
  # can come from. `visual-design` above runs on bare Node and cannot produce
  # one; a developer's machine can run the canary but not conclude from it —
  # darwin rasterises through the host compositor, which no derivation pins, so
  # `check-canary.mjs` marks a darwin run `advisory` however pinned its inputs
  # are. LINUX CI IS THE ENVIRONMENT THAT HAS TO REPRODUCE ITSELF, which is all
  # tier 1 asks for (Methodologies/visual-design-iteration.md §"Tier 1").
  #
  # A Nix runner, not ubuntu-latest + setup-node: the whole point is that the
  # browser build and the font set come from `tools/capture/capture-env.nix`
  # rather than from whatever the runner image happens to ship. The
  # `metacraft-labs/nixos-modules` setup + `eph-linux-x64` is the same pairing
  # the Cloudflare Pages deploy uses.
  #
  # WHAT THIS JOB ESTABLISHES, precisely: that two consecutive captures of the
  # canary set, in separate processes, inside the pinned environment, on
  # x86_64-linux, are byte-identical — and therefore that a tier-2 perceptual
  # baseline stored from this environment can be believed. It does NOT
  # establish that a hash here matches a hash from a developer's machine, and
  # nothing in the harness claims it does: the environment id in
  # `screenshots/canary/status.json` records the system, so a comparison across
  # two systems is visible as one rather than reported as a regression.
  visual-design-canary:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What the pinned capture environment fixes
        # Printed before anything is captured, so the run's log carries the
        # exact browser bundle, font set, node and renderer-flag digest every
        # hash below is conditional on — and the content-hash id that changes
        # when any of them moves.
        run: nix run .#capture-env -- --print-pin

      - name: Install the pinned Playwright npm package
        # The eph-* runners carry no node/npm, so npm comes from the flake.
        # `npm ci` (lockfile-exact) and no browser download: the browsers come
        # from the store, and lib/pinned-env.mjs FAILS the environment if the
        # npm version and the bundle's version disagree.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: nix develop .#capture --command npm --prefix tools/capture ci --no-audit --no-fund

      - name: The pinned-environment detector's negative controls
        # Every way of CLAIMING the environment without being in it: a bare
        # `VD0_PINNED_ENV=nix`, a browsers path outside the store, a
        # FONTCONFIG_FILE that quietly points at the host's, a Playwright
        # version skewed against the bundle, a Chromium that would launch from
        # somewhere else. Plus the positive control, and the darwin caveat.
        # Runs BEFORE the canary: a detector that can be fooled makes the
        # verdict below worthless.
        run: nix run .#capture-env -- node tools/capture/env-selftest.mjs

      - name: Build the site the capture is taken over
        # In place, at client/dist, because that is the path every tool below
        # defaults to. The exporter is a pure function of a fixed seed, so the
        # bytes handed to the browser are fixed before the capture starts;
        # capture.mjs records the tree digest so "the fixture changed" stays
        # distinguishable from "the renderer changed".
        run: |
          nix develop .#ci --command bash -c \
            'cd client && nim c -r --mm:orc -d:isServer -d:release --hints:off src/static_export.nim'

      - name: Tier 1 — the determinism canary, byte-identical
        # verify_canary_capture_is_byte_identical. Two captures of the canary
        # set in two separate processes; the assertion is byte-identity, not a
        # threshold, because at this scope anything less exact is not answering
        # the question.
        run: nix run .#capture-env -- node tools/capture/check-canary.mjs --no-build

      - name: The tier-1 verdict is USABLE — not advisory, not incoherent
        # verify_canary_failure_invalidates_the_baselines, from the other side.
        # This step is what makes the job non-vacuous: it fails when the canary
        # failed, when the verdict is advisory (which is what a run outside the
        # pinned environment produces), when it is stale, and when its own
        # fields contradict each other. If the pinned environment ever stops
        # being in effect here, this goes red instead of the canary quietly
        # becoming a host measurement.
        #
        # `nix run .#capture-env -- node`, NOT bare `node`: the eph-* runners
        # carry no node at all, which is why the step above installs npm from
        # the flake. Written bare, this step died with `node: command not
        # found` (rc 127) — the job's own non-vacuity guard, unable to run.
        # Both scripts here are pure readers of files the steps before them
        # wrote, so running them inside the pinned environment changes nothing
        # about what they decide; it only gives them an interpreter.
        run: nix run .#capture-env -- node tools/capture/require-deterministic.mjs

      - name: Full regeneration, and the named view list is covered
        # verify_capture_covers_named_view_list + verify_full_regen_removes_stale_images.
        # A full regeneration cleans first, so a renamed or deleted view leaves
        # no stale image; check-coverage then decides both halves — every
        # inventory entry named, and every image on disk corresponding to a
        # named view.
        #
        # `.#capture` and WITHOUT `--no-build`, unlike the canary step above.
        # Thirty-two of the named views are hydration-only and are served from
        # `client/dist-hydrated`, a SECOND tree built with
        # `-d:hydrationBundle=/assets/hydrate.js`. The step above builds only
        # the plain tree, so under `--no-build` every one of those views was
        # reported uncaptured and check-coverage failed — correctly; it exists
        # to notice a named view that no image covers.
        #
        # `capture.mjs` builds both trees itself when it is allowed to
        # (`runHydratedExporter` runs `hydrate/build.sh` and then the exporter),
        # and it cross-checks that the two trees came from ONE fixture. That
        # needs the Nim toolchain, which `.#capture-env` does not carry and
        # `.#capture` does — the same distinction the `journeys` job documents.
        # The plain exporter is a pure function of a fixed seed, so rebuilding
        # it here reproduces the bytes the canary just measured.
        run: |
          nix develop .#capture --command bash -c '
            vd0-capture-env node tools/capture/capture.mjs &&
            node tools/capture/check-coverage.mjs'

      - name: The ingest tool refuses what a hand would write
        # `just review-ingest-selftest`. It belongs in THIS job and not beside
        # gate-selftest in `visual-design`, for one reason: its base case hashes
        # a real capture (screenshots/debugger__wide__dark.png), and it refuses
        # to report green over an absent subject rather than skipping. So it can
        # only run where the regeneration above has just produced the images.
        #
        # Every case runs against a synthetic ledger under its own temp dir, so
        # this step's verdict does not depend on reviews/ledger.json agreeing
        # with the screenshots the step before it just rewrote — which is the
        # whole reason it is safe to put here.
        run: nix run .#capture-env -- node tools/capture/ingest-selftest.mjs

      - name: The gate decides — every condition independently blocks
        # verify_gate_definition_is_machine_checkable. Synthetic ledgers, one
        # per condition, plus the four fail-closed paths. Since VD.2 it also
        # covers `--foundations`: that the narrowed gate still fails on a
        # foundations defect, does NOT fail on a page-level one, reports the
        # full gate alongside itself, and leaves G2/G4/G5 unrelaxed.
        #
        # HERE, not in `visual-design`, for the same reason as the step above:
        # its G2 cases hash screenshots/debugger__wide__dark.png to prove they
        # can distinguish a stale hash from a missing file, and it fails closed
        # when that image is absent instead of skipping. `screenshots/` is
        # gitignored, so the only place it exists is after the regeneration two
        # steps up.
        run: nix run .#capture-env -- node tools/capture/gate-selftest.mjs

      - name: The VD.0 verifications, end to end
        # selftest.mjs re-runs all four against a throwaway output directory,
        # including the negative control that plants a stale image. In the
        # pinned environment its canary section is a tier-1 verdict rather than
        # the advisory one a developer sees.
        #
        # `.#capture`, for the same reason as the regeneration step above:
        # selftest.mjs REGENERATES into a throwaway directory, so it runs the
        # static exporter and `hydrate/build.sh`. Under `.#capture-env` it
        # reported `static exporter did not run (spawnSync nim ENOENT)`, fell
        # back to capturing whatever was already in client/dist, and then failed
        # on the hydration-only views with `hydrate/build.sh exit 3` — no Nim,
        # and no CODETRACER_SRC for the bundle. Its own message named the fix:
        # "the repository's own devShell sets it".
        run: |
          nix develop .#capture --command \
            vd0-capture-env node tools/capture/selftest.mjs

      - name: Keep the verdict and the manifest
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-canary
          # The verdict and the manifests, not the 64 images: what a later run
          # needs from this one is WHICH environment produced the hashes.
          path: |
            screenshots/canary/status.json
            screenshots/manifest.json
          retention-days: 30

  # M12 — BlockTracer's own ViewModel layer (Front-End-Architecture.md §3).
  # Two halves, and the split is the layering rather than a convenience: the
  # Tier-1 suite runs with NO debugger on the Nim path, and the seam suite runs
  # with the real Embed SDK so the wire spellings the panes parse cannot drift
  # from the ones this layer emits.
  viewmodels:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      # As in `client-sdk`: the Embed SDK, IsoNim and nim-everywhere come from
      # the flake's pinned inputs, not from hand-rolled sibling checkouts.

      - name: Tier 1 — every §14 chain row, established from a mock chain
        # No Embed SDK on the path: BlockTracer's own ViewModels are chain-aware
        # and need no debugger to be tested, which is the same layering claim
        # tests/tclientsdk.nim makes one layer down.
        run: |
          nix develop .#ci --command bash -c \
            'cd client && nim c -r --mm:orc --hints:off tests/test_chain_viewmodels.nim'

      - name: The degraded-state seam, against the real Embed SDK
        run: nix develop .#ci --command ci/test/viewmodel-seam-test.sh --require

      # M8a — the other half of the debug route. The route itself is checked
      # with no debugger on the path (the `debug-route` job below); these two
      # need the real Embed SDK and so belong here.
      - name: The debug panes, over the Embed SDK's own five ViewModels
        run: nix develop .#ci --command ci/test/debug-panes-test.sh --require

      - name: The vendored layout model still agrees with upstream
        run: |
          nix develop .#ci --command bash -c '
            ci/test/layout-model-vendor.sh --require &&
            ci/test/layout-model-vendor-test.sh'

  # M8a/M8b — the `/{chain}/tx/{hash}/debug` route, with NO debugger on the Nim
  # path. The route, the arrangement walked off CodeTracer's LayoutNode, the
  # five pane renderers, the static source renderer, §7.0's
  # availability-decides-the-landing rule and the stored crawl-surface
  # baseline: all of it is checked over a demo tree the suite generates
  # in-process, and none of it needs a replay engine. The halves that DO need
  # one are steps on the `viewmodels` job above.
  #
  # It runs inside `nix develop .#ci` rather than on a bare Nim toolchain
  # because the pages it renders inline the design-system token layer, and
  # DESIGN_SYSTEM_SRC comes from the flake's pinned input. A second checkout
  # here would be a second pin for the same bytes.
  debug-route:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tier 1 — the debug route, the arrangement and the source renderer
        run: nix develop .#ci --command bash -c 'cd client && just test-debug-route'

      - name: The static export still round-trips with the new route in it
        run: nix develop .#ci --command bash -c 'cd client && just test-export'

      # THE FIVE SUITES THAT RAN NOWHERE.
      #
      # `cd client && just test` names seven suites; this job ran two of them and
      # no other job ran any. The five below were green locally and dark in CI —
      # including `test-entry-state`, which exists specifically to stop the
      # `Nargo.toml` defect coming back, and `test-chain-provenance`, which is
      # what keeps synthetic data from asserting itself over a real capture.
      #
      # They are run as `just test` rather than five named steps, deliberately:
      # a named list here would be a third place to add a suite to, and the
      # second one is what went wrong. `ci-coverage.sh` reads the same aggregate
      # this runs, so a suite added to it is covered on the next run by both.
      - name: Every suite in `just test`, including the five that ran nowhere
        run: nix develop .#ci --command bash -c 'cd client && just test'

      - name: The two vendored-layout gates no job named
        # `flow-layout-vendor.sh` and its self-test guard the Omniscience layout
        # arithmetic against upstream. `layout-model-vendor.sh` — the same
        # pattern, one file over — was already in the `viewmodels` job; these two
        # were written beside it and never wired up.
        run: |
          nix develop .#ci --command bash -c '
            bash ci/test/flow-layout-vendor.sh &&
            bash ci/test/flow-layout-vendor-test.sh'

      # DOES `test_selection_detail.nim` BITE? The proof-of-bite for the one Nim
      # suite that exists BECAUSE a guard somewhere else was dead.
      #
      # WHY IT IS A STEP AND NOT AN AGGREGATE MEMBER. `client/Justfile` says so
      # in its own words — "NOT in `just test` — it is ~100 compiles and takes
      # minutes. It is the same relation `ci/test/<subject>-test.sh` has to
      # `ci/test/<subject>.sh`" — and that relation is one this workflow already
      # runs everywhere: every `-test.sh` proof-of-bite above is its own step,
      # never folded into the suite it proves. Folding this one in would put a
      # mutation sweep into every developer's `just test` to satisfy a guard.
      #
      # So it was RIGHT to keep it out of the aggregate and WRONG that nothing
      # then ran it. `ci-coverage.sh` step 1b reported the second half and was
      # read as demanding the first; it now asks "is this recipe run by
      # ANYTHING" and this step is the answer for this one.
      #
      # `.#ci` supplies both interpreters it needs: the sweep is driven by node
      # and every arm recompiles the suite with nim.
      #
      # BOUNDED, for the reason the `journeys` job states beside its own bound:
      # without `timeout-minutes` a step inherits the job's 360, and a sweep
      # that stalls burns six hours and is then CANCELLED — which prints no
      # RESULT line and reads, in the log, exactly like a step nobody ran. 60
      # against 96 arms (79 negations + 17 planted product defects), each one a
      # Nim compile of the suite.
      - name: Does the selection-detail suite bite? (79 negations, 17 planted defects)
        timeout-minutes: 60
        run: |
          nix develop .#ci --command bash -c \
            'cd client && just test-selection-detail-selftest'

  # ── Journey conformance ────────────────────────────────────────────────────
  # Spec claims, judged in a browser, over the artefact this repository DEPLOYS.
  #
  # WHY THIS JOB EXISTS. Every other job here asserts one component's contract:
  # the route classifies, the renderer emits the class, the exporter round-trips,
  # the tokens resolve. Four user-visible defects passed all of them, because no
  # check anywhere stated an end-to-end claim — and the two the debug route lost
  # were invisible to `test-debug-route`'s 115 cases specifically because those
  # cases drive `renderToString`, and what a visitor loads is that markup plus
  # `client/hydrate/hydrate.js` re-rendering every pane on top of it.
  #
  # WHY IT BUILDS WITH NIX RATHER THAN WITH `just export-hydrated`. `nix build
  # .#default` is what `deploy-cloudflare-pages.yml` uploads. Running the local
  # exporter here would test a build no visitor is served, and this repository
  # has already been bitten by driving the wrong one of the two.
  #
  # WHY IT IS ITS OWN JOB. `visual-design-canary` owns the pinned browser for
  # PIXELS and asserts byte-identity between two runs; this asserts BEHAVIOUR and
  # must be free to click things, which would invalidate that job's determinism
  # claim. Sharing the runner would couple a screenshot baseline to a step
  # sequence.
  journeys:
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What the pinned browser environment fixes
        run: nix run .#capture-env -- --print-pin

      - name: Install the pinned Playwright npm package
        # ONE pin for the whole repository. `tools/journeys` resolves playwright
        # out of `tools/capture/node_modules` rather than declaring a second
        # dependency, because a skewed pair works and silently behaves
        # differently — which is why lib/pinned-env.mjs refuses a skew.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: nix develop .#capture --command npm --prefix tools/capture ci --no-audit --no-fund

      - name: Build the site the deploy uploads
        # `.#default` and not the local exporter: hydrate/build.sh --require runs
        # first, so a tree that cannot produce the bundle fails HERE rather than
        # serving the pre-hydration page and passing.
        run: nix build .#default

      - name: Stage it, and copy the replay engine to its own origin
        # §5.1: `new Worker(scriptURL)` requires a same-origin script, so the
        # engine is COPIED rather than linked — the same step, from the same
        # script, that deploy-cloudflare-pages.yml runs.
        run: |
          rm -rf .journey-site && mkdir -p .journey-site
          cp -R result/. .journey-site/
          chmod -R u+w .journey-site
          # INTO THE CACHE, and let the runner stage from there.
          #
          # The engine used to be fetched straight into `.journey-site/`, and the
          # selftest step below then reported NEVER RAN for its two hydration
          # arms: those arms rebuild into `client/dist`, which had no engine, so
          # their journeys SKIPPED and emitted no assertions to match against.
          # The harness was right to call that "never ran" rather than a kill —
          # an arm whose journey did not execute has demonstrated nothing — but
          # the arms were measuring the wrong tree.
          #
          # `lib/engine.mjs` copies the cache into whichever `--dist` it is given,
          # so one fetch now serves both the selftest's `client/dist` and the
          # verdict's `.journey-site`. It is fetched once because it is 18 MB.
          ./client/hydrate/fetch-engine.sh client/.replay-engine-cache

      # THE WORKING TREE IS NOT THE NIX BUILD, and the selftest below uses the
      # working tree.
      #
      # `nix build .#default` above runs `hydrate/build.sh` INSIDE the
      # derivation, so the bundle it produces lives in the store and lands in
      # `result/`. Nothing puts one at `client/hydrate/hydrate.js`. The selftest
      # rebuilds the exporter locally with `-d:hydrationBundle=/assets/hydrate.js`
      # (it must — that define is what makes a debug page carry the script tag
      # the journeys assert on), and `installHydrationBundle` then refuses to
      # emit a page naming a bundle that was never produced.
      #
      # On the first real-runner execution of this job that is exactly what
      # happened, and the harness reported it correctly rather than scoring six
      # kills over a tree that does not build:
      #
      #     the unmutated tree does not build; nothing below would mean anything
      #
      # That is the control arm doing its job. Build the bundle in the tree the
      # selftest actually compiles against.
      - name: Build the hydration bundle in the working tree
        run: nix develop .#capture --command bash -c 'cd client && just hydrate'

      - name: Does it say when it did NOT run — and does the sharding partition?
        # Machinery that reports an ENDING is only exercised by an ending, so an
        # ordinary sweep covers none of it — which is how it would rot with
        # nobody noticing, in the one tool whose job is to certify that every
        # other instrument is honest. Six probes now, sixteen assertions: four
        # real endings, each demanded to name itself, plus the two that guard
        # the sharding.
        #
        # PROBES 5 AND 6 ARE WHY THIS STEP MATTERS MORE THAN IT USED TO. The
        # sweep is now split across four `journeys-bite` shards, and that trade
        # is only safe if the four are a PARTITION — every arm in exactly one,
        # their union the whole list. A sharded sweep that silently drops an arm
        # is strictly worse than the timeout it replaced: a timeout is loud, and
        # a missing arm is not. Probe 5 proves the partition through `shardOf`,
        # the same function the runs slice with, in about a second and without
        # executing an arm. Probe 6 proves `--combine` REFUSES a broken one — a
        # dropped arm, a duplicated arm, a stale arm, a shard that never ran,
        # and a survivor — because a defence nobody has watched fail is
        # indistinguishable from no defence.
        #
        # It no longer has to run after the sweep. That ordering existed because
        # both wrote `.selftest-journal.json`; the shards write
        # `.selftest-journal.shard-IofN.json`, so they no longer collide.
        timeout-minutes: 20
        run: |
          nix develop .#capture --command \
            vd0-capture-env bash tools/journeys/selftest-verdict-test.sh

      - name: The journeys, over the deployed artefact
        run: |
          nix run .#capture-env -- node tools/journeys/run.mjs \
            --dist .journey-site --json journey-report.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-report
          path: journey-report.json
          if-no-files-found: warn

  # ── The bite sweep, in four shards ──────────────────────────────────────────
  #
  # WHY THIS IS NOT A STEP ON `journeys` ANY MORE.
  #
  # It was, bounded at `timeout-minutes: 150`, and it could not pass. Measured
  # twice, killed at the bound both times to the second — 33739737152 at 150m13s
  # and 33814944100 at 150m12s. The second got 40 of the 64 arms started and 33
  # KILLED before it was cut off, which puts the full sweep at 230-280 minutes.
  # One runner was being parked for 150 minutes to produce a guaranteed failure.
  #
  # FOUR SHARDS AND NOT A BIGGER BOUND. The runner-hours are about the same
  # either way (4 x ~70 min against 1 x ~5 h) but the WALL CLOCK is not, and on a
  # pool that has been at zero idle a single job holding one runner for five
  # hours blocks deploys for the whole window. A five-hour bound would also be a
  # guess: 230-280 is a range, and its upper end plus variance sits close enough
  # to five hours that the bound would be set from an estimate that fails at the
  # top of its own range — the same defect one size up. Four shards is also what
  # the only complete pass this suite has ever recorded actually used.
  #
  # `fail-fast: false` IS LOAD-BEARING. With the default, one red shard cancels
  # its three siblings, they leave no journals, and `--combine` reports DID NOT
  # RUN — turning a specific, named, surviving arm into "the sweep did not
  # finish". The failure that matters would be hidden by the mechanism reporting
  # it.
  #
  # A SHARD IS NOT A VERDICT. Its journal is a claim about the arms it holds;
  # the claim about the suite is made by `journeys-combine` below, and only
  # there.
  journeys-bite:
    runs-on: eph-linux-x64
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What the pinned browser environment fixes
        run: nix run .#capture-env -- --print-pin

      - name: Install the pinned Playwright npm package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: nix develop .#capture --command npm --prefix tools/capture ci --no-audit --no-fund

      - name: Fetch the replay engine into the cache
        # The arms REBUILD into `client/dist`, and `lib/engine.mjs` copies this
        # cache into whichever `--dist` it is given. Without it the hydration
        # arms' journeys SKIP and the harness correctly reports NEVER RAN — an
        # arm whose journey did not execute has demonstrated nothing.
        #
        # No `nix build .#default` and no `.journey-site` here: this job does
        # not judge the deployed artefact, it mutates the working tree. That is
        # the `journeys` job's work and it is not repeated four times.
        run: ./client/hydrate/fetch-engine.sh client/.replay-engine-cache

      - name: Build the hydration bundle in the working tree
        # The selftest compiles against the WORKING TREE, and `nix build`
        # produces its bundle inside the derivation. Without this the control
        # arm correctly reports "the unmutated tree does not build; nothing
        # below would mean anything".
        run: nix develop .#capture --command bash -c 'cd client && just hydrate'

      - name: Do the journeys bite? (shard ${{ matrix.shard }} of 4)
        # `--shard i/n` slices by STRIDE rather than by contiguous block,
        # deliberately: the expensive arms are adjacent in the list, so a
        # contiguous shard would hold all of them and be the whole problem
        # again.
        #
        # 150, AND THE FIRST NUMBER HERE WAS 90, WHICH WAS ALSO TOO SMALL.
        # Measured on shard 2 of run 33826955858: `--shard 2/4: running 16 of 64
        # arm(s)`, 15 of those 16 KILLED, then killed at 90m13s — cut off on its
        # last arm. That is ~5.8 min/arm, not the ~3.8 the previous estimate
        # used, and the difference is contention: that figure came from a lone
        # sweep, while three shards plus the rest of this workflow now share a
        # pool observed running four jobs at a time.
        #
        # So the honest full-sweep cost is ~370 minutes, not the 230-280 first
        # estimated from the unsharded run — which makes the decision to shard
        # rather than raise a single bound to five hours the right one for a
        # stronger reason than the one it was taken on: five hours would not
        # have been enough either.
        #
        # 16 x 5.8 is ~93 minutes and this is 150, so the headroom is ~60% on a
        # measured figure rather than a guess about one. It is still a bound: a
        # sweep that stalls stops, and `journeys-combine` names the shard.
        #
        # IF THIS ONE IS ALSO EXCEEDED, raise the SHARD COUNT and not this
        # number. Wall-clock to a verdict is what sharding buys, and buying it
        # back with a longer bound gives up the reason for the split.
        timeout-minutes: 150
        run: |
          nix develop .#capture --command \
            vd0-capture-env node tools/journeys/selftest.mjs --shard ${{ matrix.shard }}/4

      - name: The shard's journal
        # `always()`: a shard that was killed still leaves a journal saying it
        # was running, and that is exactly what `--combine` needs in order to
        # say WHICH shard did not finish instead of reporting a subset as a
        # verdict.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-selftest-journal-${{ matrix.shard }}
          path: tools/journeys/.selftest-journal.shard-${{ matrix.shard }}of4.json
          if-no-files-found: warn
          retention-days: 7

  # ── ONE verdict over the four shards ────────────────────────────────────────
  #
  # `--combine` is not an OR of passes. It fails unless the shards' arms unioned
  # are EXACTLY the arm list — every arm once, none missing, none twice, none
  # left over from an older list — and every one of them killed. A shard that
  # produced no journal is named, by index, as DID NOT RUN rather than as a
  # failure: "three of four shards passed" is not a claim about the suite.
  #
  # `if: always()`: it must run even when a shard went red, because a red shard
  # is precisely when the distinction between "an arm survived" and "a shard
  # died" has to be drawn. Without this the matrix's own failure would be the
  # only thing reported and the reason would be lost.
  #
  # `ubuntu-latest` and bare node: `--combine` reads JSON with node builtins and
  # imports nothing else, so it needs neither the Nix runner nor a browser. A
  # gate that needs the busy Nix pool to state its verdict is a gate that waits
  # behind the thing it is judging.
  journeys-combine:
    needs: journeys-bite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect every shard's journal
        uses: actions/download-artifact@v4
        with:
          pattern: journey-selftest-journal-*
          merge-multiple: true
          path: tools/journeys

      - name: What arrived
        # Printed before the verdict, so a run whose combine says DID NOT RUN
        # shows on its face whether the journal was absent or merely unfinished.
        run: ls -la tools/journeys/.selftest-journal.shard-*of4.json || true

      - name: Every arm, over the four shards, exactly once
        run: node tools/journeys/selftest.mjs --combine 4
