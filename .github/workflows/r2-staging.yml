name: Staging on R2

# SERVE STAGING FROM R2 — operator decision 2026-10-23: a new bucket behind
# staging.blocktracer.org, the same shape as production, keeping the
# blocktracer-staging Pages project serving until this is verified.
#
# Production, as read by a GET-only probe (run 40126845332): the R2 bucket has
# blocktracer.org as its custom domain, and the zone's `http_request_transform`
# entrypoint ("blocktracer.org index resolution") rewrites a directory path to its
# index.html with two rules keyed on `http.host eq "blocktracer.org"`. No worker
# serves it.
#
# The bucket, its custom domain and the two index rewrite rules are EDGE CONFIG,
# and edge config belongs in metacraft-labs/infra (metacraft-dev-guidelines
# managing-web-site-content.md §4). This job used to be `ensure`, which created
# whatever was missing through the Cloudflare API, and did so on 2026-10-24.
# infra has since adopted them: the rules are declared in
# terraform/cloudflare/metacraft-prod's `blocktracer_org_index_rewrite` (infra
# #2024) and the bucket is imported there. The custom domain stays outside
# Terraform only because the Cloudflare provider cannot import an R2 custom
# domain. So `check-edge` is now READ-ONLY: it fails, naming what is missing,
# when the bucket, the domain or the rules are absent, and it never creates or
# edits anything. A missing piece is fixed by a PR to infra, not by this
# workflow. `publish` builds `site-staging` (what the staging Pages deploy
# builds), vendors the replay engine, publishes with the same
# `blocktracer-publish` and lease production uses, and reads the result back
# over HTTPS.

# ON EVERY PUSH TO `staging`, beside the Pages deploy and not instead of it (operator: keep
# blocktracer-staging.pages.dev until R2 is verified). Verified end to end on the bring-up
# branch, run 40140298121: every chain page, the registry, the engine, the traced
# ETH transaction and its debug page 200, and the container it loads byte-identical to the
# one published. `workflow_dispatch` republishes without a push.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: r2-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING_BUCKET: blocktracer-staging
  STAGING_HOST: staging.blocktracer.org
  PROD_HOST: blocktracer.org

jobs:
  check-edge:
    runs-on: ["self-hosted", "linux", "x64"]
    timeout-minutes: 15
    steps:
      - name: Bucket, custom domain and index rewrite exist for the staging host (read-only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # GET only. Nothing in this step may create or edit a Cloudflare object.
          get() {
            local out
            out=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$1")
            if ! jq -e '.success' >/dev/null <<<"$out"; then
              echo "::error::GET $1 failed: $(jq -c '.errors' <<<"$out" 2>/dev/null || echo unparseable)" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          Z0="https://api.cloudflare.com/client/v4/zones"
          fix="Declare it in metacraft-labs/infra terraform/cloudflare/metacraft-prod; this workflow no longer creates edge config."
          missing=0

          if get "$A/r2/buckets/$STAGING_BUCKET" >/dev/null; then
            echo "bucket: present ($STAGING_BUCKET)"
          else
            echo "::error::bucket $STAGING_BUCKET is missing. $fix"; missing=1
          fi

          domains=$(get "$A/r2/buckets/$STAGING_BUCKET/domains/custom" || echo '{}')
          if jq -e --arg d "$STAGING_HOST" \
               '[.result.domains[]? | select(.domain == $d and .enabled == true)] | length == 1' \
               >/dev/null <<<"$domains"; then
            echo "custom domain: present and enabled ($STAGING_HOST)"
          else
            echo "::error::custom domain $STAGING_HOST is missing or disabled on $STAGING_BUCKET. It is the one piece infra cannot import (no Terraform import for R2 custom domains); restore it through infra's Cloudflare-Resource-Lifecycle runbook."
            missing=1
          fi

          ZONE=$(get "$Z0?name=$PROD_HOST" | jq -r '.result[0].id // empty')
          [ -n "$ZONE" ] || { echo "::error::zone $PROD_HOST not found"; exit 1; }
          EP=$(get "$Z0/$ZONE/rulesets/phases/http_request_transform/entrypoint")
          n=$(jq --arg h "http.host eq \"$STAGING_HOST\"" \
                '[.result.rules[] | select(.enabled and .action == "rewrite" and (.expression | contains($h)))] | length' \
                <<<"$EP")
          if [ "$n" -eq 2 ]; then
            echo "index rewrite: 2 enabled rules for the staging host"
          else
            echo "::error::expected 2 enabled index rewrite rules for $STAGING_HOST, found $n. $fix"; missing=1
          fi
          jq -r '.result.rules[] | "  rule: " + .description' <<<"$EP"

          [ "$missing" -eq 0 ] || { echo "::error::staging edge config is incomplete; refusing to publish"; exit 1; }

  publish:
    needs: check-edge
    runs-on: ["self-hosted", "linux", "x64"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the staging site
        run: nix build .#site-staging
      - name: Stage a clean, writable publish dir
        run: |
          set -euo pipefail
          rm -rf site; cp -rL result site; chmod -R u+w site
          echo "staged $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"
      - name: Vendor the replay engine into the publish dir
        env:
          ENGINE_BASE: ${{ vars.REPLAY_ENGINE_BASE || 'https://web-codetracer.pages.dev' }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          nix develop .#ci --command bash client/hydrate/fetch-engine.sh site/replay-engine "$ENGINE_BASE" \
            .deploy/engine-fetch.json
      # THE S3 KEY IS NOT THE PRODUCTION KEY. R2_ACCESS_KEY_ID is scoped to the production
      # bucket: run 40127030550's first write here, the publish lease, was AccessDenied. The
      # Cloudflare API token that created this bucket has account R2 write, and R2's documented
      # S3 view of an API token is (access key = the token's id, secret = sha256 of its value).
      # So the staging publish uses that, derived here and masked, and the production key keeps
      # its narrower scope.
      - name: Publish to the staging bucket
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          tid=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                  "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | jq -r '.result.id // empty')
          [ -n "$tid" ] || { echo "::error::the API token reports no id; cannot derive its S3 credentials"; exit 1; }
          secret=$(printf '%s' "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$tid"; echo "::add-mask::$secret"
          export AWS_ACCESS_KEY_ID="$tid" AWS_SECRET_ACCESS_KEY="$secret"
          # A LEASE PRESENT NOW IS STALE. Only this workflow publishes to the staging bucket, and
          # its concurrency group runs one at a time, so a lease left in `_leases/` belongs to a
          # run that was killed mid-publish (run 40129234648 was, by a runner shutdown, and the
          # retry was refused: "chain 'aztec-testnet' is locked by another publisher").
          for k in $(nix develop .#ci --command aws s3 ls "s3://$STAGING_BUCKET/_leases/" \
                       --endpoint-url "$ENDPOINT" 2>/dev/null | awk '{print $4}'); do
            echo "breaking stale lease _leases/$k"
            nix develop .#ci --command aws s3 rm "s3://$STAGING_BUCKET/_leases/$k" --endpoint-url "$ENDPOINT"
          done
          nix develop .#ci --command nim c --hints:off -d:release \
            -o:blocktracer-publish src/blocktracer_publish.nim
          # --refresh: staging is republished as its content changes, so every existing
          # key whose bytes differ is superseded rather than skipped.
          nix develop .#ci --command ./blocktracer-publish \
            --tree site --backend s3 --bucket "$STAGING_BUCKET" --endpoint "$ENDPOINT" --refresh
      - name: Read it back over HTTPS
        run: |
          set -uo pipefail
          fail=0
          for p in / /chains/ /ethereum-mainnet/ /solana-mainnet/ /starknet-mainnet/ /flow-mainnet/ /sui/ /aztec/ \
                   /registry/chains.v1.json /replay-engine/worker.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$STAGING_HOST$p")
            echo "$code $p"; [ "$code" = 200 ] || fail=1
          done
          # THE TRACED TRANSACTION THE STAGING CAPTURE PRODUCES, and the container its debug page
          # loads, checked by hash: a 200 on a page is not a trace. `sed -n 1p` and not `head`:
          # steps run under bash -e with pipefail, and head closing the pipe killed grep with
          # SIGPIPE (run 40131995740). `grep -m1` was no fix, the page is one line.
          tx=/ethereum-mainnet/tx/0xf6998cac9f5d2843729743b866bdc4b09bd119774bbec5e56f69f8819f2b71aa
          for p in "$tx/" "$tx/debug/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$STAGING_HOST$p"); echo "$code $p"; [ "$code" = 200 ] || fail=1
          done
          ct=$(curl -s "https://$STAGING_HOST$tx/debug/" | grep -oE '/t/[a-z0-9/]+/trace\.ct' | sed -n 1p)
          # `Accept-Encoding: br`: a container is published brotli with Content-Encoding br, and an
          # edge that is not told the client takes brotli decompresses it (run 40135420848 read the raw
          # 81,920-byte container against the 2,356 bytes published). Asking for br returns the
          # stored bytes, which is what the published copy is.
          sum=$(curl -s -H 'Accept-Encoding: br' "https://$STAGING_HOST$ct" | sha256sum | cut -c1-16)
          echo "container ${ct:-<none>} sha256 $sum"
          # Against the bytes this job published, so the check follows the tree rather than a constant.
          want=$( [ -n "$ct" ] && [ -f "site$ct" ] && sha256sum "site$ct" | cut -c1-16 || echo none)
          echo "published sha256 $want"
          [ -n "$ct" ] && [ "$sum" = "$want" ] || { echo "::error::the debug page does not load the container this job published"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "::error::staging on R2 does not answer every page"; exit 1; }
