name: Publish the site tree to R2

# ---------------------------------------------------------------------------
# PUBLISH A BUILT SITE TREE TO THE `blocktracer` R2 BUCKET.
#
# DEPLOY.md Step 4 names this workflow and nothing implemented it, so the only
# publish path that has ever existed is an operator running the binary by hand.
# That is acceptable exactly once — DEPLOY.md calls it "a one-off operator run
# (first go-live)" — and is the wrong shape for everything after, for the
# reason Deployment-And-Operations.md §6c gives: production is applied by a
# protected identity, not from somebody's laptop.
#
# ── WHAT THIS CAN AND CANNOT PUBLISH, STATED UP FRONT ────────────────────────
#
# It publishes WHAT CI CAN BUILD: `nix build .#default` -> `result/`, which is
# the demo/fixture tree plus the client. That is the continuous case.
#
# It CANNOT publish the full chain history, and pretending otherwise would be
# the more useful-sounding lie. The 201,780-block corpus is ~10 GB of ingested
# state that took hours of RPC against a live node; CI has neither the state
# nor the time, and a 14 GB tree exceeds every artifact limit here. Until the
# ingest runs somewhere persistent (the high-mem-server plan), a full-history
# publish stays an operator run against a locally assembled tree.
#
# So: this workflow keeps the SITE fresh. It does not keep the HISTORY fresh.
#
# ── WHY MANUAL-ONLY ──────────────────────────────────────────────────────────
#
# No `push:` trigger. A publish flips `current.json`, which is the one mutable
# object per chain and the thing a visitor's session pins — §3.3. Making that
# a side effect of merging would mean every merge is a production cutover.
# `workflow_dispatch` keeps the decision where §6c puts it: with a human.
#
# ── THE LEASE IS WHY TWO RUNS ARE SAFE ───────────────────────────────────────
#
# `blocktracer-publish` holds a per-chain single-writer lease keyed on the
# publisher's PID under a reserved `_leases/` prefix, so a second overlapping
# run is REFUSED ("chain 'aztec' is locked by another publisher") rather than
# interleaving with the first. `concurrency` below is belt-and-braces: it stops
# the second run being queued at all, so the refusal stays a safety net rather
# than the normal path.
#
# ── `render-over-live`: THE ONE CASE THIS *CAN* PUBLISH REAL HISTORY ────────
#
# "It publishes WHAT CI CAN BUILD" above is true for the continuous case and
# was never the whole story: `client/src/static_export.nim` can render every
# chain from a tree it did not itself ingest (`-d:dataOrigin=<dir>`, with a
# per-chain exception for a chain that tree does not carry —
# `-d:chainOrigins=<chain>=<dir>`, read that file's own header). CI has no
# 10 GB capture to ingest, but it already has read credentials on the bucket
# that DOES hold one. `render-over-live: true` uses them: stage the bucket's
# data plane, point the render at it, and the output is the demo/fixture
# CLIENT over PRODUCTION's data — "a demo ends up overwriting index.html, _a/
# and replay-engine/ next to the real history" stops being the only way this
# combination happens, and becomes a reviewed, opt-in one instead.
#
# Off by default, same spirit as `dry-run` and `allow-foreign-chains`: this
# changes what gets rendered, costs an R2 read of the live data plane before
# the build even starts, and — because a build that renders over live data is
# exactly the build that could get a live chain's `current.json` wrong in a
# new way — it is followed by two assertions with no equivalent in the
# continuous path: the pointer-pin step and the index-size step below, both
# of which run (and print) whether or not `dry-run` is set, so a human reads
# their verdict before any real publish is possible.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Publish to a local directory and diff it against the tree instead of
          writing to R2. Proves the tree and the binary without touching
          production. Leave true unless you mean it.
        type: boolean
        default: true
      bucket:
        description: >-
          The R2 bucket to publish into. REQUIRED and deliberately without a
          default. This workflow publishes what CI can build — `nix build
          .#default`, the client over the DEMO data tree — and defaulting that
          at the production bucket is how a demo ends up overwriting
          `index.html`, `_a/` and `replay-engine/` next to the real history.
          Name a staging bucket unless you mean production.
        type: string
        required: true
      allow-foreign-chains:
        description: >-
          Publish even though the bucket already serves chains this tree does
          not contain. Off by default: that combination means the tree is a
          subset of what is live, and the site objects it overwrites are shared
          by every chain, not guarded per chain.
        type: boolean
        default: false
      include-demo-chain:
        description: >-
          With `render-over-live`, also publish the DEMO chain out of this
          build's own tree. On by default, which is the behaviour this workflow
          has always had — but measured 2026-10-10, it is the wrong default for
          production: the live bucket serves `aztec`, `aztec-testnet` and
          `aztec-testnet-frames` and NO demo, while this build's demo chain
          carries 15 container-version-5 traces. OFF sets `-d:noDemoChain`,
          which skips the INGEST — so the tree carries no demo data and no
          registry row. That matters: dropping only the `chainOrigins` entry
          leaves the registry row in place, and with `render-over-live` the
          demo's data is then looked for on an origin that has none, which
          RAISES `cannot open chain 'demo'` after every real chain has been
          enumerated. This description used to say the demo was "therefore not
          rendered"; that was the intention, not the behaviour.
          WHY OFF FOR A PARITY PUBLISH, since half of the original reason
          expired on 2026-10-12: it no longer holds that the engine cannot open
          those 15. The pin moved to `9f332ae0ddfabe6b…`, container {5,6} with
          all four CCP-5 loader strings present, and that engine has been
          watched opening a compact container. What still argues for OFF is a
          product decision rather than a format one: the live bucket serves no
          `demo` chain, so turning this on ADDS a chain rather than refreshing
          one. See `client/hydrate/engine-pin.txt`'s 2026-10-12 section.
        type: boolean
        default: true
      refresh:
        description: >-
          Supersede objects whose KEY already exists, instead of skipping
          them. Off by default, because the continuous path's "a re-run
          uploads zero" rests on that default and is the property that
          matters there. MEASURED on runs 38957112297 and 38995672069: this
          was reachable ONLY through `render-over-live`, which conflates two
          independent decisions — WHAT to render (the repo's own tree, or the
          live bucket's data) and WHETHER to overwrite keys that already
          exist. The combination a branch needs to ship re-recorded captures
          is the repo's tree WITH overwriting, and it had no spelling: with
          `render-over-live: false` the publisher reported success and skipped
          every one of the thirteen debug pages, because their keys were
          already in the bucket, so production kept serving pages that name no
          container while the containers themselves sat beside them. Turn this
          on to replace existing objects from an ordinary build.
        type: boolean
        default: false

      render-over-live:
        description: >-
          Render the client over the LIVE bucket's data instead of over this
          build's own demo/fixture tree (static_export.nim's -d:dataOrigin /
          -d:chainOrigins, read its header). Off by default: the ordinary
          build above is unchanged when this is false. On, this job first
          syncs the bucket's `d/`, `idx/`, `t/` and `src/` prefixes — the only
          ones a data origin is ever read through — into a staging directory,
          builds against it, then PINS every live chain's `d/<chain>/
          current.json` to the bucket's own bytes and refuses to publish a
          global hash index smaller than the live one. Needed to ship a tree
          rendered over production's real history rather than the curated
          local fixture, which is this workflow's missing capability.
        type: boolean
        default: false
      break-stale-leases:
        description: >-
          Delete every `_leases/<chain>.lock` in the bucket before publishing.
          OFF by default and deliberately so: that lock IS the single-writer
          guarantee, and breaking one while a publisher is genuinely running
          lets two writers interleave on one chain. Pass it only when a previous
          publish was KILLED — the lease is released by its holder and a
          SIGKILLed process releases nothing, which `publisher.nim` records as
          "a stale lease is a manual/operational concern, deliberately not
          auto-broken here to keep single-writer honest". The step prints each
          lock's holder before removing it, and the step below it prints the
          lease state on EVERY run whether or not this is set.
        type: boolean
        default: false
      verify-origin:
        description: >-
          The PUBLIC origin the design-parity check reads after a real publish.
          Not the bucket endpoint: the claim is about what a visitor receives,
          and an origin's own 404 behaviour is part of that (Cloudflare Pages
          answers 200 with the entry document for every unknown path, which is
          the trap `client/hydrate/engine-pin.txt` documents twice).
        type: string
        default: 'https://blocktracer.org'
      runner:
        description: >-
          JSON array of capability labels, decoded with fromJSON at `runs-on`.
          Matches the convention deploy-cloudflare-pages.yml established after
          `eph-linux-x64` stopped being served on 2026-09-14.
        type: string
        default: '["self-hosted","linux","x64"]'

concurrency:
  # NOT `cancel-in-progress`. Cancelling a publish mid-flight leaves the bucket
  # holding a partial upload with the pointer unflipped — recoverable, because
  # the publisher is idempotent and resumable, but the recovery is a second run
  # and not a cancellation. Queue the second run instead.
  group: publish-r2-blocktracer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # NAMED RATHER THAN LEFT AT THE 360-MINUTE DEFAULT, and the number is a
    # MEASUREMENT rather than a round figure. A job that runs into the implicit
    # ceiling is reported as `cancelled`, which is the label this fleet also
    # uses for two unrelated failure modes, so the ceiling belongs here where a
    # reader of the log can see what was exceeded.
    #
    # 240 WAS WRONG AND WOULD HAVE MADE THIS JOB FAIL SOONER THAN NO DECLARATION
    # AT ALL. It was chosen while the staging step was still running and before
    # anything had measured the whole job. Run 38270630793, render-over-live
    # against production with the aws CLI's default concurrency of 10:
    #
    #   staging the data plane   240 min   (~882,600 objects, mean under 17 KB)
    #   building the site tree   106 min AND STILL RUNNING when the implicit
    #                            360-minute ceiling arrived
    #
    # So the honest figure is "more than 346 minutes at 10-way concurrency".
    # This used to claim `AWS_MAX_CONCURRENT_REQUESTS=64` would take the staging
    # share down a long way. IT DID NOT, BECAUSE THAT IS NOT A VARIABLE THE AWS
    # CLI READS — see the staging step below, which now sets the dial where the
    # CLI actually looks. Every render-over-live run to date, including the
    # 240-minute one measured here, ran at the default 10. The build's share is
    # untouched by concurrency either way and has no measured upper
    # bound yet — which is exactly the condition in which a tight ceiling turns
    # a slow job into a failed one. 600 is deliberately generous: these are
    # self-hosted runners, where the 360-minute figure is not a platform limit,
    # and the per-prefix counts the staging step now prints are what makes a
    # genuinely hung job distinguishable from a long one without waiting for a
    # timeout to decide it.
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      # NIX IS PROVISIONED, NOT SELECTED — and this workflow was the one job in
      # the repository that did neither.
      #
      # Every step below runs `nix develop .#ci --command`, and there was no
      # `setup-nix`. It worked for as long as the job happened to land on a
      # PERSISTENT host, which bakes Nix in; run 38312510438 landed on
      # `garm-dugkgplfvt4u` — an ephemeral incus guest — and died at the first
      # step with `nix: command not found`, exit 127, before staging a single
      # object. The label sets are the tell:
      #
      #   high-mem-server-mcl-00*  self-hosted, Linux, X64, nixos, bare-metal, …
      #   garm-*                   self-hosted, Linux, X64, ephemeral, incus, …
      #
      # `[self-hosted, linux, x64]` matches both, so this was a coin flip that
      # had been coming up heads.
      #
      # THE FIX IS NOT TO ADD `nixos` TO THE SELECTOR, and `ci.yml` already
      # argues why in its own words: "`setup-nix` INSTALLS Nix when the host has
      # none (`DeterminateSystems/nix-installer-action`, gated on a
      # `command -v nix` probe). Nix is a property this workflow provisions, not
      # one it must select a host for. `nixos` is advertised only by the
      # PERSISTENT hosts, so requiring it would exclude every ephemeral guest."
      # Narrowing the labels would trade a provisioning step for permanent
      # contention on the bare-metal pool — and `metacraft-dev-guidelines`'
      # §"Contention is answered by class selection, not by reaching for hosted"
      # is about picking a class, not about shrinking the set that can serve.
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      # Stage the LIVE bucket's data plane, when asked to render over it.
      #
      # WHAT GETS SYNCED, AND WHY NOT MORE OR LESS. `client/src/reader.nim`'s
      # `DataRoot.dataStore` doc says exactly what a data origin is read
      # through: "THE DEFAULT DATA ORIGIN — `/d/**`, `/idx/**`, `/src/**` and
      # `/t/**`". Nothing else in the tree is ever reached via `-d:dataOrigin`
      # — `registry/**` stays "the environment's own" by the same file's
      # design (so an environment cannot acquire a chain merely by sharing a
      # store with one that has it; this build's own ingest of
      # `client/fixtures/chain/**` already writes the registry rows for the
      # chains it means to publish), and `_leases/`, `index.html`, `_a/**`,
      # `replay-engine/**` and `assets/**` are the SITE's own objects, which
      # this build renders fresh and must NOT pull stale copies of from the
      # live bucket.
      #
      # ONE WORD OF THAT WAS FALSE UNTIL 2026-10-13: `replay-engine/**` is not
      # RENDERED by anything. It is FETCHED, from the publisher named by
      # `engine-pin.txt`, and this workflow had no step that did so — see
      # "Vendor the replay engine into the publish dir" below, which is the step
      # `deploy-cloudflare-pages.yml` has had since the same defect bit the
      # Pages path. The sentence above is kept because its CONCLUSION is right
      # (these prefixes must not be pulled from the live bucket) and only the
      # mechanism was wrong.
      #
      # So this syncs exactly four prefixes, not a full mirror of the
      # ~882,000-object live tree: a full sync would multiply the egress and
      # the runner's disk for objects the renderer never opens, and syncing
      # less (say, `d/` alone, without `idx/`/`t/`/`src/`) would make the
      # render silently fall back to this build's own stale fixture data for
      # the index, the traces or the source bundles the moment a page asked
      # for one — the exact "looks identical, isn't" failure mode
      # `resolveDataOrigins`'s own comment warns about.
      # WHAT HOLDS THE LEASES — READ FIRST, BEFORE ANYTHING EXPENSIVE.
      #
      # Run 38417127259 spent 4h47m staging, rendering and checking, and then
      # failed in the publisher's first second with "chain 'aztec' is locked by
      # another publisher (lease held)". The lock was readable the whole time.
      # This step costs one LIST and up to three GETs and it runs before the
      # 75-minute stage, so a held lease is a three-minute failure instead of a
      # five-hour one.
      #
      # READ-ONLY: it never deletes. Breaking is a separate, default-off step
      # placed immediately before `Publish`, so the window between breaking a
      # lock and taking it is seconds rather than the length of a render.
      - name: Who holds the publish leases?
        if: ${{ inputs.dry-run == false }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ inputs.bucket }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            locks=$(aws s3 ls "s3://$BUCKET/_leases/" --endpoint-url "$ENDPOINT" 2>/dev/null || true)
            if [ -z "$locks" ]; then echo "leases: none held"; exit 0; fi
            echo "leases currently held:"
            printf "%s\n" "$locks" | awk "{print \$4}" | while read -r k; do
              [ -n "$k" ] || continue
              who=$(aws s3 cp "s3://$BUCKET/_leases/$k" - --endpoint-url "$ENDPOINT" 2>/dev/null | tr -d "\n" || true)
              echo "  _leases/$k  held by: ${who:-<unreadable>}"
            done
          '

      - name: Stage the live bucket's data plane
        if: ${{ inputs.render-over-live == true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          LIVE_BUCKET: ${{ secrets.R2_BUCKET || 'blocktracer' }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::render-over-live needs R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY" \
                 "to read the live bucket's data plane. Refusing to render over" \
                 "nothing."
            exit 1
          fi
          # EXPORTED, because the sync below runs in a child shell under `nix
          # develop` and a non-exported value would arrive empty — which `aws
          # s3 sync` would read as a relative destination and "succeed".
          export LIVE_ORIGIN="$RUNNER_TEMP/live-origin"
          mkdir -p "$LIVE_ORIGIN"
          # `aws` comes from `devShells.ci`, like every other tool this workflow
          # runs. It used to be invoked bare, and on 2026-10-12 run 38269686081
          # died here with `aws: command not found`, exit 127 — AFTER the
          # credential check above had passed on four freshly-landed secrets, so
          # the log reads like a secrets failure and is not one. One `nix
          # develop` wraps the whole loop rather than each call, because
          # realising the shell is the expensive part.
          # CONCURRENCY, BECAUSE THE DEFAULT IS TEN AND THIS IS ~900,000 SMALL
          # OBJECTS. The local copy of this data plane holds 882,642 files in
          # 14 GB — a mean under 17 KB — so the sync is latency-bound, not
          # bandwidth-bound, and `max_concurrent_requests` is the only dial
          # that matters. At the default 10 the first run of this step was
          # still going after 80 minutes with no way to see whether it was
          # progressing; that is what the per-prefix counts below are for.
          #
          # ── THE DIAL WAS NEVER TURNED. `AWS_MAX_CONCURRENT_REQUESTS` AND
          #    `AWS_MAX_QUEUE_SIZE` ARE NOT AWS CLI ENVIRONMENT VARIABLES. ────
          #
          # This block used to `export` those two names. The CLI never reads
          # them: `awscli/customizations/s3/subcommands.py` builds its transfer
          # config from `self._session.get_scoped_config().get('s3', {})` and
          # nothing else, and `get_scoped_config()` is the CONFIG FILE's profile
          # section. Measured against awscli2 2.35.11 — with the two variables
          # exported and no config file, `max_concurrent_requests` resolves to
          # 10 and `max_queue_size` to 1000, the untouched defaults from
          # `transferconfig.py`.
          #
          # Run 40312450881's own log corroborates it: 460,813 objects in
          # 11,659s is 39.5 objects/second, which is 10 requests in flight at
          # ~250 ms each — not 64. Every render-over-live run this repository
          # has ever done has run at the default, including the 240-minute
          # staging the `timeout-minutes` note above measured.
          #
          # So the settings go where the CLI looks. `AWS_CONFIG_FILE` IS a real
          # botocore variable (`configprovider.py`), and credentials keep coming
          # from the environment, so this file carries tuning only.
          #
          # WRITTEN WITH `printf`, NOT A HEREDOC. A heredoc body has to start in
          # column 0 for `configparser` to read `[default]` as a section header
          # rather than a continuation line — and column 0 ends the YAML block
          # scalar this step is written in, so the file would not parse as a
          # workflow at all. `printf` keeps the YAML indented and puts the
          # config file's own columns where the parser needs them.
          export AWS_CONFIG_FILE="$RUNNER_TEMP/aws-s3-tuning.conf"
          { printf '[default]\n'
            printf 's3 =\n'
            printf '    max_concurrent_requests = 32\n'
            printf '    max_queue_size = 10000\n'
          } > "$AWS_CONFIG_FILE"
          echo "aws s3 tuning written to $AWS_CONFIG_FILE:"
          sed 's/^/    | /' "$AWS_CONFIG_FILE"
          # 32, NOT THE 64 THAT WAS ONLY EVER WRITTEN DOWN. The one concurrency
          # this bucket has actually been measured at is 10, and at 10 it still
          # returned `ServiceUnavailable: Reduce your rate of simultaneous reads
          # on the same object` partway through `t/`. Tripling a rate that
          # already drew a throttle is a step to take deliberately and with
          # backpressure, not a number to inherit from a comment.
          #
          # ── A 503 IS A RATE LIMIT, NOT A FAILURE, AND IT KILLED A 3.2-HOUR
          #    STAGE. ───────────────────────────────────────────────────────
          #
          # awscli2 already defaults to `standard` retries with 3 attempts, so
          # the throttle that ended run 40312450881 had survived three tries:
          # it was sustained, not a blip. `adaptive` adds what `standard` has
          # not got — a client-side rate limiter that measures throttling
          # responses and lowers the send rate until they stop — which is the
          # mechanism that makes asking for 32 safe. More attempts give it room
          # to find the rate.
          export AWS_RETRY_MODE=adaptive
          export AWS_MAX_ATTEMPTS=10
          # A COUNT PER PREFIX, NOT ONE AT THE END. `--only-show-errors` is
          # right — 900,000 "download:" lines is not a log — but it left the
          # step silent for its whole duration, and a silent step is
          # indistinguishable from a hung one. Each prefix now reports what it
          # brought and how long it took, so the next reader can tell "slow"
          # from "stuck" without waiting for the step to end.
          # AND AN OUTER RETRY, BECAUSE `sync` IS RESUMABLE AND THE STAGE IS
          # NOT. When the throttle outlived the client's own backoff, one
          # failed object took the whole step with it and the 460,813 already
          # on disk were thrown away with the runner. `aws s3 sync` compares
          # the destination before it fetches, so a second attempt re-lists and
          # downloads only what is missing — seconds of work to protect hours
          # of it. That is why the retry wraps the sync rather than replacing
          # the `set -e`: each attempt is idempotent, and the step still fails
          # loudly if the origin is genuinely unavailable.
          nix develop .#ci --command bash -euo pipefail -c '
            for prefix in d idx t src; do
              mkdir -p "$LIVE_ORIGIN/$prefix"
              t0=$(date +%s)
              attempt=1
              until aws s3 sync "s3://$LIVE_BUCKET/$prefix" "$LIVE_ORIGIN/$prefix" \
                      --endpoint-url "$R2_ENDPOINT" --only-show-errors; do
                if [ "$attempt" -ge 4 ]; then
                  echo "::error::$prefix/: sync still failing after $attempt attempts." \
                       "This is no longer a rate limit the client can ride out."
                  exit 1
                fi
                echo "  $prefix/: attempt $attempt did not complete; retrying in" \
                     "$(( attempt * 30 ))s — sync resumes, so what is already" \
                     "staged is not fetched again"
                sleep $(( attempt * 30 ))
                attempt=$(( attempt + 1 ))
              done
              n=$(find "$LIVE_ORIGIN/$prefix" -type f | wc -l)
              echo "  $prefix/: $n object(s) in $(( $(date +%s) - t0 ))s" \
                   "($attempt attempt(s))"
            done
          '
          echo "LIVE_ORIGIN=$LIVE_ORIGIN" >> "$GITHUB_ENV"
          staged=$(find "$LIVE_ORIGIN" -type f | wc -l)
          echo "staged $staged object(s) from s3://$LIVE_BUCKET/{d,idx,t,src}"
          # AN EMPTY STAGE IS A REFUSAL. Every later step treats `$LIVE_ORIGIN`
          # as production's data plane: `-d:dataOrigin` renders through it, the
          # pointer pin reads `d/<chain>/current.json` out of it, and the
          # index-shrink guard compares against its `idx/hash/meta.json`. With
          # nothing staged all three would compare against absence — and the
          # shrink guard, whose whole job is to refuse a smaller index, would
          # have nothing to be smaller than.
          if [ "$staged" -eq 0 ]; then
            echo "::error::the live data plane staged ZERO objects. Every guard" \
                 "below reads this directory, so they would all compare against" \
                 "an empty tree and pass. Refusing. Check the bucket name" \
                 "($LIVE_BUCKET), the endpoint, and that the token can LIST."
            exit 1
          fi

      # The full deployable tree is the flake PACKAGE, not `just export` —
      # deploy-cloudflare-pages.yml records why, and the same reasoning holds
      # here. `result/` is a read-only /nix/store symlink, so dereference it
      # into a writable directory before anything walks it.
      #
      # render-over-live REPLICATES `packages.default`'s buildPhase (flake.nix)
      # rather than parameterizing it, run via `nix develop ..#ci` instead of
      # `nix build`: a Nix derivation is sandboxed against the host
      # filesystem, and `-d:dataOrigin` has to resolve `$LIVE_ORIGIN`, a path
      # on the runner the sandbox does not and should not see. The ordinary
      # path is untouched — same `nix build .#default`, same `result` ->
      # `site` copy — so this is purely additive.
      - name: Build the site tree
        env:
          RENDER_OVER_LIVE: ${{ inputs.render-over-live }}
          INCLUDE_DEMO_CHAIN: ${{ inputs.include-demo-chain }}
        run: |
          set -euo pipefail
          # TWO FLAGS, BECAUSE ONE WAS NOT ENOUGH AND THE SHORTFALL WAS A CRASH.
          #
          # `-d:chainOrigins=demo=dist` points the demo chain at this build's own
          # tree. Dropping it does NOT hold the demo back: step 1's ingest writes
          # `dist/d/demo/**` and the REGISTRY row regardless, and `chains(r)` is
          # read from the application origin — the tree — never from the data
          # origin (`reader.nim`: "The registry is the environment's own
          # statement of what it publishes"). So the demo stays enumerated, its
          # data is looked for on the LIVE origin, production carries no demo,
          # and `chainInfo` RAISES.
          #
          # Reproduced rather than reasoned, in seconds, against a two-tree
          # fixture — a `-d:noDemoChain` export as the stand-in live origin and
          # an ordinary export rendered over it:
          #
          #     … aztec-testnet-frames routes so far: 234  (0s elapsed)
          #     reader.nim(654)          chainInfo
          #     Error: unhandled exception: cannot open chain 'demo':
          #            no d/demo/current.json in local:…/a/dist
          #
          # NOTE WHERE IT RAISES — after every real chain, because `demo` sorts
          # last. That is why run 38270630793 spent 106 minutes enumerating and
          # died to its ceiling without ever reporting this: the crash was still
          # ahead of it. A production-sized run would burn hours and then hit it.
          #
          # `-d:noDemoChain` is the switch that actually holds the demo back; it
          # gates the ingest itself (`static_export.nim`'s
          # `when not defined(noDemoChain)`), so there is no registry row to
          # enumerate and nothing to resolve. The old text claimed the demo was
          # "therefore not rendered", which was the intended behaviour and not
          # the behaviour.
          if [ "$INCLUDE_DEMO_CHAIN" = "true" ]; then
            DEMO_ORIGIN_FLAG='-d:chainOrigins=demo=dist'
            DEMO_INGEST_FLAG=''
            echo "demo chain: INCLUDED (-d:chainOrigins=demo=dist)"
          else
            DEMO_ORIGIN_FLAG=''
            DEMO_INGEST_FLAG='-d:noDemoChain'
            echo "demo chain: HELD BACK (-d:noDemoChain) — the ingest is skipped," \
                 "so the tree carries no demo data and no registry row, and" \
                 "nothing enumerates a chain the live origin cannot resolve."
          fi
          if [ "$RENDER_OVER_LIVE" = "true" ]; then
            LIVE_ORIGIN="${LIVE_ORIGIN:?render-over-live needs the staging step above to have run}"
            ( cd client
              nix develop ..#ci --command bash ./hydrate/build.sh --require
              nix develop ..#ci --command nim js --hints:off -d:release \
                --path:src --path:../src \
                --nimcache:searchboot/nimcache \
                -o:searchboot/search.js searchboot/searchboot.nim
              nix develop ..#ci --command nim js --hints:off -d:release \
                --path:src --path:../src \
                --nimcache:settingsboot/nimcache \
                -o:settingsboot/settings.js settingsboot/settingsboot.nim
              # `-d:chainOrigins=demo=dist`: the demo chain (DemoChainSlug,
              # src/blocktracer/demo/generator.nim) has no entry in the live
              # bucket, so without this it would inherit the default data
              # origin below and 404. "dist" is this same build's own output
              # directory — by the time static_export.nim reads origins, step
              # 1's ingest has already written dist/d/demo/** to disk, so this
              # is "opt the one chain the live tree does not carry back out of
              # the redirect", not a forward reference.
              nix develop ..#ci --command nim c -r --mm:orc -d:isServer -d:release \
                -d:hydrationBundle=/assets/hydrate.js \
                -d:searchBundle=/assets/search.js \
                -d:settingsBundle=/assets/settings.js \
                -d:dataOrigin="$LIVE_ORIGIN" \
                $DEMO_ORIGIN_FLAG \
                $DEMO_INGEST_FLAG \
                src/static_export.nim
            )
            cp -rL client/dist site && chmod -R u+w site
          else
            nix build .#default
            cp -rL result site && chmod -R u+w site
          fi

      # THE CRITICAL SAFETY PROPERTY OF render-over-live: pin every live
      # chain's visibility pointer to the bucket's own bytes.
      #
      # Rendering over the live data plane does not make this build's own
      # `d/<chain>/current.json` correct — that file was written by THIS
      # build's ingest of `client/fixtures/chain/**` (step 1 of
      # `exportSite`), which is the curated local fixture, not the live
      # pointer. Measured on this branch: publishing it would have moved
      # `aztec` from generation `raztec00001` head 102,690 to generation `1`
      # head 68,231 — a regression `assertRegistryKeepsKnownChains` cannot see
      # because it compares chain NAMES, never pointer contents.
      #
      # So: copy the bucket's own `current.json` over this build's for every
      # chain the bucket already serves (everything staged under
      # `$LIVE_ORIGIN/d`), then ASSERT byte-identity rather than trust the
      # copy — the same "verify, don't just build" rule the bottom of this
      # file already applies to the bucket itself.
      - name: Pin the live chain pointers
        if: ${{ inputs.render-over-live == true }}
        run: |
          set -euo pipefail
          LIVE_ORIGIN="${LIVE_ORIGIN:?}"
          # ── ONE PREDICATE MUST NOT STAND FOR TWO CAUSES, AND HERE IT DID ───
          #
          # This loop used to call a bare `cmp -s`, and run 38316440069 — which
          # got through a 496,899-object stage and a 385,731-page render — died
          # here with:
          #
          #     line 14: cmp: command not found
          #     ::error::current.json pin FAILED for: aztec aztec-testnet
          #              aztec-testnet-frames
          #
          # `cmp` is not on the NixOS runners' ambient PATH, so the `if` took
          # its else branch for every chain and the step reported a POINTER
          # MISMATCH — a claim about production's data — when a tool was
          # missing. `ci.yml`'s `contract` job records this repository being bitten
          # by the same thing with `diff`: "the self-hosted NixOS runner has no
          # `diff` in its ambient PATH — so every run of this job since the
          # toolchain moved into the flake ended `line 3: diff: command not
          # found`". `cmp` is in `devShells.ci` (diffutils 3.12, verified with
          # `nix develop .#ci --command command -v cmp`).
          #
          # THE WHOLE LOOP RUNS INSIDE ONE `nix develop`, and the verdict per
          # chain is written to a file rather than carried in an exit code.
          # Wrapping each `cmp` individually would leave `nix develop`'s OWN
          # failure exit (1) indistinguishable from `cmp`'s "the bytes differ"
          # (1) — the same conflation one layer up. Here `cmp`'s status is read
          # where it is produced: 0 identical, 1 different, >1 could not
          # compare, and each is a different line.
          # NOT `$out`. That name is Nix's: inside `nix develop` it is the
          # derivation's output path, so exporting an `out` of our own had the
          # child shell append to `<repo>/outputs/out` and die with "No such
          # file or directory". Found by running this block locally before
          # dispatching it, which is the order the rest of today argues for.
          PIN_REPORT="$RUNNER_TEMP/pointer-pin.txt"
          : > "$PIN_REPORT"
          export LIVE_ORIGIN PIN_REPORT
          nix develop .#ci --command bash -euo pipefail -c '
            [ -d "$LIVE_ORIGIN/d" ] || exit 0
            for chain_dir in "$LIVE_ORIGIN"/d/*/; do
              [ -d "$chain_dir" ] || continue
              chain=$(basename "$chain_dir")
              live_ptr="$chain_dir/current.json"
              [ -f "$live_ptr" ] || continue   # bucket has the chain but no pointer yet
              site_ptr="site/d/$chain/current.json"
              mkdir -p "$(dirname "$site_ptr")"
              cp "$live_ptr" "$site_ptr"
              set +e
              cmp -s "$live_ptr" "$site_ptr"
              rc=$?
              set -e
              case "$rc" in
                0) echo "pinned $chain" >> "$PIN_REPORT" ;;
                1) echo "mismatched $chain" >> "$PIN_REPORT" ;;
                *) echo "uncompared $chain exit=$rc" >> "$PIN_REPORT" ;;
              esac
            done
          '
          pinned="$(awk '$1=="pinned"{printf " %s", $2}' "$PIN_REPORT")"
          mismatched="$(awk '$1=="mismatched"{printf " %s", $2}' "$PIN_REPORT")"
          uncompared="$(awk '$1=="uncompared"{printf " %s(%s)", $2, $3}' "$PIN_REPORT")"
          if [ -n "$uncompared" ]; then
            echo "::error::the pointer comparison DID NOT RUN for:$uncompared." \
                 "That is not a mismatch and not a pass: cmp exits 0 for identical," \
                 "1 for different, and above 1 when it could not compare. Refusing," \
                 "because a step that cannot read the bytes cannot report on them."
            exit 1
          fi
          if [ -n "$mismatched" ]; then
            echo "::error::current.json pin FAILED for:$mismatched — this build's" \
                 "pointer still differs from the live bucket's own copy after" \
                 "copying it in. Refusing to publish: a curated pointer here" \
                 "truncates a live chain."
            exit 1
          fi
          if [ -n "$pinned" ]; then
            echo "pointer pin OK — byte-identical to the live bucket for:$pinned"
          else
            echo "pointer pin: the live bucket serves no chain's current.json yet" \
                 "(first go-live) — nothing to pin."
          fi

      - name: The global hash index did not shrink
        if: ${{ inputs.render-over-live == true }}
        run: |
          set -euo pipefail
          LIVE_ORIGIN="${LIVE_ORIGIN:?}"
          # Through the dev shell, like every other tool here: a bare `python3`
          # is a gate that measures whatever the runner image happens to carry.
          nix develop .#ci --command python3 -c '
          import json, os, sys

          site_path = "site/idx/hash/meta.json"
          live_path = sys.argv[1]

          if not os.path.exists(live_path):
              print("index size: the live bucket publishes no idx/hash/meta.json yet (first go-live) -- nothing to compare.")
              sys.exit(0)
          if not os.path.exists(site_path):
              print("::error::this build published no idx/hash/meta.json at all, but the live bucket has one.")
              sys.exit(1)

          site_meta = json.load(open(site_path))
          live_meta = json.load(open(live_path))

          def versions_of(meta):
              vs = {str(meta.get("indexVersion")): (meta.get("shardCount", 0), meta.get("entryCount", 0))}
              for v in meta.get("versions", []):
                  vs[str(v.get("version"))] = (v.get("shardCount", 0), v.get("entryCount", 0))
              return vs

          site_v = versions_of(site_meta)
          live_v = versions_of(live_meta)
          problems = []
          for ver, (live_shards, live_entries) in live_v.items():
              if ver not in site_v:
                  problems.append("v" + ver + ": missing entirely in the built tree (live has " +
                                   str(live_shards) + " shards / " + str(live_entries) + " entries)")
                  continue
              site_shards, site_entries = site_v[ver]
              if site_shards < live_shards or site_entries < live_entries:
                  problems.append("v" + ver + ": built " + str(site_shards) + " shards / " +
                                   str(site_entries) + " entries < live " + str(live_shards) +
                                   " shards / " + str(live_entries) + " entries")

          if problems:
              print("::error::global hash index shrank: " + "; ".join(problems))
              sys.exit(1)

          for ver, (shards, entries) in sorted(site_v.items()):
              live_shards, live_entries = live_v.get(ver, (0, 0))
              print("index v" + ver + ": built " + str(shards) + " shards / " + str(entries) +
                    " entries (live: " + str(live_shards) + " shards / " + str(live_entries) + " entries) -- OK")
          ' "$LIVE_ORIGIN/idx/hash/meta.json"

      # A publish of an incomplete tree is worse than no publish: it flips the
      # pointer to a generation whose objects are missing. These are the two
      # checks that have each caught a real defect — check-assets found the
      # replay engine missing, and the classifier found four site objects that
      # belonged to no chain and were silently skipped.
      # VENDOR THE ENGINE INTO THE PUBLISH DIR — the one site object this
      # workflow's own comment claims it "renders fresh" and never produced.
      #
      # Every page carries `data-replay-engine="/replay-engine/"` and constructs
      # `new Worker("/replay-engine/worker.js", {type:"module"})`.
      # `deploy-cloudflare-pages.yml` has had this step since the defect it
      # records in its own words: "Until this step existed nothing was ever
      # published under that prefix, so the worker 404'd on every deployed page
      # and the debugging controls were inert on a site that otherwise looked
      # complete. The failure was fast (~1 s) and quiet, and it read as 'the
      # engine is stale' for hours."
      #
      # THIS WORKFLOW HAD THE SAME HOLE, and the comment at "Stage the live
      # bucket's data plane" asserts the opposite — it lists `replay-engine/**`
      # among "the SITE's own objects, which this build renders fresh and must
      # NOT pull stale copies of from the live bucket". The first half was never
      # true: nothing here rendered or fetched it. Measured by exporting the
      # same configuration locally and running the next step's checker over the
      # result:
      #
      #     A1  FAIL  …/tx/…/debug/index.html  data-replay-engine="/replay-engine/"
      #                 → replay-engine  (no directory)
      #
      # So the next step would have caught it — which is why it is a guard and
      # not a surprise — but it would have caught it after the sync and the
      # render, hours in.
      #
      # `fetch-engine.sh` asserts each file against `engine-pin.txt` by sha256,
      # so a base serving a different engine fails here naming both hashes
      # rather than publishing it. `vars.REPLAY_ENGINE_BASE` redirects the
      # ORIGIN and cannot redirect the bytes.
      - name: Vendor the replay engine into the publish dir
        env:
          ENGINE_BASE: ${{ vars.REPLAY_ENGINE_BASE || 'https://web-codetracer.pages.dev' }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash client/hydrate/fetch-engine.sh \
            site/replay-engine "$ENGINE_BASE"

      # AND ASSERT IT IS THERE, on the bytes about to be uploaded rather than
      # trusted. Same three files `deploy-cloudflare-pages.yml` names, and the
      # same reason: "A green build that publishes a site whose worker 404s
      # must not be able to reach production again."
      - name: The engine is in the publish dir, and the pages ask for it there
        run: |
          set -euo pipefail
          missing=0
          for f in replay-engine/worker.js \
                   replay-engine/pkg/db_backend.js \
                   replay-engine/pkg/db_backend_bg.wasm; do
            if [ ! -s "site/$f" ]; then echo "missing/empty: site/$f" >&2; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "the engine is not in the publish dir" >&2; exit 1; }
          # The pages ask for a specific prefix. If somebody changes
          # `replayEngineBase`, this catches the mismatch here rather than in a
          # visitor's console.
          page="$(find site -path '*/tx/*/debug/index.html' -print -quit)"
          if [ -n "$page" ]; then
            base="$(grep -oE 'data-replay-engine="[^"]*"' "$page" | head -1 |
                    sed 's/.*="//; s/"$//')"
            echo "pages request their engine from: ${base:-<none>}"
            if [ "$base" != "/replay-engine/" ]; then
              echo "::error::the pages name '${base:-<none>}' but this step vendored" \
                   "site/replay-engine/. A cross-origin base is a deliberate build" \
                   "choice (-d:replayEngineBase) and this publish path does not set" \
                   "one, so the two disagreeing means the tree and the upload would" \
                   "not match."
              exit 1
            fi
          else
            echo "::error::no */tx/*/debug/index.html in the tree, so which prefix the" \
                 "pages ask for could not be read. That is not a pass: this check" \
                 "exists because a site can look complete with an inert debugger."
            exit 1
          fi

      - name: The tree carries what a visitor needs
        # `--require-traces` ASKS WHETHER *THIS PUBLISH* CARRIES TRACES, and for a
        # render-over-live publish the answer is no BY DESIGN: the containers are
        # already in the bucket and this tree does not re-upload them. Passing it
        # unconditionally made run 38349961009 fail A3 after 161 minutes —
        # correctly, by its own terms, about the wrong publish shape.
        #
        # THE RUN ALSO FOUND SOMETHING REAL, AND IT IS NOT THIS FLAG. The scan
        # completed for the first time and reported:
        #
        #   scanned: 385,732 pages, 4,333,747 same-origin references, 299,461
        #            distinct assets — A1, A2, A4, A5, A6 all PASS
        #   not resolved: … 104,368 EMPTY
        #   attributes:   data-trace x104368, data-replay-engine x104368
        #
        # 104,368 `data-trace` attributes and 104,368 empty references are the
        # same number: every debug page rendered over live emits
        # `data-trace=""`. `pages/debug.nim:397` emits it from `canShare`, and
        # `session_view.nim:1611` is `canShare = hasFrame and
        # containerPath.len > 0` — so no page is offered a container.
        #
        # THE CAUSE IS IN THE LIVE DATA, measured on the 2026-09-29 copy of the
        # production tree at `~/m/blocktracer-go-live/dist`:
        #
        #   18,093 trace.ct        18,093 manifest.json
        #        6 instructions.json    6 calltrace.json    1 positions.json
        #
        # against a current render, where every artifact has all of them. The
        # live tree's trace artifacts PREDATE the sidecar derivations the debug
        # route needs for a first frame, so `hasFrame` is false everywhere and
        # `canShare` with it. Deriving those 18,093 sidecars is its own job
        # (`just chain-instructions` / `chain-positions` / `chain-calltrace`);
        # it is NOT a precondition for publishing the design, because production
        # today serves 7,942-byte pre-hydration stubs with no engine, no bundle
        # and no replay at all — this tree is strictly better than that with or
        # without the sidecars.
        #
        # So the flag follows the publish shape, and the sidecar gap is named
        # here rather than hidden behind a passing gate.
        run: |
          set -euo pipefail
          if [ "${{ inputs.render-over-live }}" = "true" ]; then
            echo "A3: NOT REQUIRED — the containers are the live bucket's and this" \
                 "tree does not carry them. See the comment above for what the live" \
                 "tree's artifacts are missing and why it does not block the design."
            nix develop .#ci --command node tools/deploy/check-assets.mjs --dir site
          else
            nix develop .#ci --command node tools/deploy/check-assets.mjs --dir site --require-traces
          fi

      # BREAKING ONE IS AN OPERATOR ACT, AND IT LIVES HERE RATHER THAN IN THE
      # PUBLISHER ON PURPOSE. `publisher.nim`'s `releaseLease` only deletes a
      # lock whose holder matches, and its comment says why: "a stale lease is a
      # manual/operational concern, deliberately not auto-broken here to keep
      # single-writer honest." Adding `--break-lease` to the binary would undo
      # that decision for every caller; a default-off input on the one workflow
      # that publishes leaves the guarantee intact and makes the exception
      # reviewable.
      #
      # WHY IT WAS NEEDED: run 38388168109's `blocktracer-publish` was SIGKILLed
      # when its ephemeral runner was reaped mid-publish ("Terminate orphan
      # process: pid (4237)"). A killed holder releases nothing, so
      # `_leases/aztec.lock` survived it and run 38417127259 failed after four
      # and three-quarter hours with "chain 'aztec' is locked by another
      # publisher (lease held)".
      - name: Break stale publish leases
        if: ${{ inputs.dry-run == false && inputs.break-stale-leases == true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ inputs.bucket }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            locks=$(aws s3 ls "s3://$BUCKET/_leases/" --endpoint-url "$ENDPOINT" 2>/dev/null || true)
            if [ -z "$locks" ]; then
              echo "break-stale-leases: nothing is held — no lock to break."
              echo "That is not an error: it means the state this input exists for"
              echo "is not the state the bucket is in."
              exit 0
            fi
            printf "%s\n" "$locks" | awk "{print \$4}" | while read -r k; do
              [ -n "$k" ] || continue
              who=$(aws s3 cp "s3://$BUCKET/_leases/$k" - --endpoint-url "$ENDPOINT" 2>/dev/null | tr -d "\n" || true)
              echo "breaking _leases/$k (was held by: ${who:-<unreadable>})"
              aws s3 rm "s3://$BUCKET/_leases/$k" --endpoint-url "$ENDPOINT"
            done
          '

      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          nix develop .#ci --command nim c --hints:off -d:release \
            -o:blocktracer-publish src/blocktracer_publish.nim

          if [ "${{ inputs.dry-run }}" = "true" ]; then
            # The local backend mirrors the same key layout, so this exercises
            # classification, the lease and the pointer order without a
            # credential and without touching the bucket.
            ./blocktracer-publish --tree site --backend local --dest "$RUNNER_TEMP/dry"
            echo "dry run: $(find "$RUNNER_TEMP/dry" -type f | wc -l) objects would be written"
            exit 0
          fi

          # REFUSE rather than publish blind if the credential is absent. An
          # empty AWS_ACCESS_KEY_ID makes the aws CLI fail per object, which
          # reads as a transport problem rather than a missing secret.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::R2_ACCESS_KEY_ID is not set on this repository." \
                 "Mint an R2 token scoped Object Read & Write on the" \
                 "'blocktracer' bucket only (DEPLOY.md Step 3) and seal it." \
                 "Refusing to publish without it."
            exit 1
          fi

          # EXPORTED for the same reason LIVE_ORIGIN is: the guard and the
          # publisher below both run under `nix develop`, because both need
          # `aws` on PATH — the guard calls it directly and
          # `publish/objectstore.nim`'s `S3ObjectStore.putMany` shells out to
          # `aws s3 cp --recursive`, once per Content-Encoding.
          export BUCKET='${{ inputs.bucket }}'
          export ENDPOINT='${{ secrets.R2_ENDPOINT }}'

          # THE GUARD THAT MAKES THIS SAFE TO POINT AT PRODUCTION.
          #
          # `assertRegistryKeepsKnownChains` stops the registry LOSING a chain
          # row. It says nothing about the objects published beside the
          # registry, and `index.html`, `404.html`, `_a/**` and
          # `replay-engine/**` are shared by every chain rather than owned by
          # one. So "the registry survived" and "production is unchanged" are
          # different claims, and only the first has a guard.
          #
          # If the bucket already serves chains this tree does not contain,
          # this tree is a SUBSET of what is live, and publishing it overwrites
          # those shared objects with a build that was never rendered against
          # the live history. Refuse, and say which chains.
          live=$(nix develop .#ci --command \
                   aws s3 cp "s3://$BUCKET/registry/chains.v1.json" - \
                   --endpoint-url "$ENDPOINT" 2>/dev/null || true)
          if [ -n "$live" ]; then
            # `python3 -c`, not a heredoc: a heredoc terminator has to sit at
            # column zero, and everything here is indented inside a YAML block
            # scalar, so the quoted form would never terminate.
            missing=$(nix develop .#ci --command python3 -c 'import json,sys; live=set(json.loads(sys.argv[1]).get("chains",{})); here=set(json.load(open("site/registry/chains.v1.json"))["chains"]); print(",".join(sorted(live-here)))' "$live")
            if [ -n "$missing" ] && [ "${{ inputs.allow-foreign-chains }}" != "true" ]; then
              echo "::error::s3://$BUCKET already serves chain(s) this tree does" \
                   "not contain: $missing. This tree is a subset of what is" \
                   "live, and the site objects it would overwrite (index.html," \
                   "_a/**, replay-engine/**) are shared by every chain and are" \
                   "NOT protected by the per-chain registry guard. Publish a" \
                   "tree that contains them, or re-run with" \
                   "allow-foreign-chains if you mean it."
              exit 1
            fi
          fi

          # ── `--refresh` ON A RENDER-OVER-LIVE PUBLISH, AND WITHOUT IT THE
          #    PAGES DO NOT MOVE ────────────────────────────────────────────
          #
          # Run 38366603048 published successfully — pointers flipped on all
          # three chains — and uploaded 40 + 8 + 9 = 57 objects. The new site
          # shell went up and is live:
          #
          #   /_a/0c49ff0f45fccc3a.css          200  341,628 B   (this build's)
          #   /assets/hydrate.js                200  2,075,139 B
          #   /replay-engine/worker.js          200
          #
          # and every one of the 385,732 rendered pages did NOT. A transaction
          # page is still the 7,942-byte pre-hydration stub, cache-busted.
          #
          # WHY, read out of `publisher.nim` rather than guessed: `classOf` sends
          # any non-root `.html` to `ocEntryPage`, and `strategyOf`'s `else` arm
          # is `stKeyExistence` — "present ⇒ skip". The live bucket already holds
          # `aztec/tx/<hash>/index.html` at every one of those keys, so every
          # page was skipped. The key did not move; only the bytes behind it did.
          #
          # `--refresh` is this publisher's own documented remedy, in its own
          # words: "re-read every key-existence object and supersede the ones
          # whose bytes differ from the tree's. OFF by default: the ordinary
          # cycle must upload zero on a re-run, and this one costs a GET per
          # object. It is what makes 'a range can be refreshed after a producer
          # fix' true — without it a corrected object never reaches a store that
          # already holds the wrong one, because its key did not move."
          #
          # A render-over-live publish IS that case by construction: it exists to
          # replace what the bucket serves for keys the bucket already has. The
          # continuous path keeps the default, so "a re-run uploads zero" stays
          # true where it is the property that matters.
          #
          # THE COST IS REAL AND BOUNDED: one GET per object over ~386,000 keys.
          # At the staging step's measured ~100 objects/s that is around an hour,
          # on top of 75 min staging and 85 min rendering — comfortably inside
          # the 600-minute ceiling, which is why `timeout-minutes` was raised to
          # 600 rather than left at the 240 I first wrote.
          # EITHER REASON IS ENOUGH, and they are different reasons.
          #
          # `render-over-live` implies it by construction — that mode exists to
          # replace what the bucket serves for keys the bucket already has. But
          # it was the ONLY way to ask for it, which made "render the repo's
          # tree" and "overwrite existing keys" one choice instead of two, and
          # the combination a branch needs to ship re-recorded captures — the
          # repo's tree, overwriting — could not be expressed at all.
          #
          # Run 38995672069 is the worked example: `render-over-live: false`,
          # every step green including "does the bucket hold the site objects
          # the tree does?", and all thirteen Aztec debug pages still serving
          # `data-trace=""` afterwards. The publisher had skipped them on key
          # existence. The containers those pages point at were already in the
          # bucket and byte-identical, so the publish was simultaneously
          # correct and useless.
          REFRESH=""
          if [ "${{ inputs.render-over-live }}" = "true" ] || \
             [ "${{ inputs.refresh }}" = "true" ]; then
            REFRESH="--refresh"
            echo "publishing with --refresh: every key-existence object is re-read" \
                 "and superseded where the bytes differ. Without it the entry pages" \
                 "are skipped, because their keys already exist in the bucket."
          fi
          nix develop .#ci --command ./blocktracer-publish \
            --tree site \
            --backend s3 \
            --bucket "$BUCKET" \
            --endpoint "$ENDPOINT" \
            $REFRESH

      # A green publish is a claim about a process; the objects being served
      # is a claim about the bucket. This project has been bitten by that
      # distinction repeatedly — a registry that silently lost a chain, a tree
      # advertising a 35-block window over 201,780 blocks — so a publish is not
      # finished until something reads the bucket back and checks IDENTITY, not
      # counts and not HTTP status.
      #
      # THE VERIFIER IS ON THIS BRANCH NOW — the `::error::` arm below is the
      # one this comment used to describe and is kept as the refusal it always
      # was, not as a description of the present. PR #40
      # (`ci/test/verify-published-readonly.sh` over
      # `src/blocktracer/verify/audit.nim`) MERGED, and the file is present on
      # `agents`, `dev` and this branch — checked with `git cat-file -e` on each
      # rather than on one. So the `if` takes its first arm, and the second
      # exists for the world where somebody deletes the script.
      #
      # AND IT ANSWERS A DIFFERENT QUESTION FROM THE STEP AFTER IT. This one
      # asks whether the DATA is there — identity by sampling and arithmetic.
      # It says nothing about the design: a tree can hold every object this
      # build published, with correct hashes, and serve a stylesheet carrying
      # none of CodeTracer's panel rules. That was production's exact state on
      # 2026-10-12, and no check in this workflow would have reported it.
      # DOES THE BUCKET HOLD WHAT THE TREE HOLDS? Site-level prefixes only, by
      # key set, which is a few LISTs and no GETs.
      #
      # THIS IS THE CHECK THAT WAS MISSING AND THE REASON A PUBLISH LOOKED DONE
      # WHEN IT WAS NOT. Run 38504065692 published successfully, reported
      # `content uploaded: 0` on every chain, and left production answering 404
      # — `cf-cache-status: MISS`, so a real origin 404 — for all nine
      # `/assets/ct-icons/**` icons the served stylesheet names. The 2026-09-29
      # copy of the live tree holds four files under `assets/`, all fonts, and
      # no icons: they have never been published by anything.
      #
      # Nothing in the pipeline compared the bucket's key set against the
      # tree's. `check-assets` reads the TREE (and passed, 13 url(s) resolving),
      # the publisher reports what IT decided to upload, and the step below used
      # to run a lint of the verifier rather than the verifier. Three green
      # signals, none of them about the bucket.
      #
      # So: for each site-level prefix the tree carries, list the same prefix in
      # the bucket and diff the key sets. A key in the tree and not the bucket
      # is a publish that did not finish, whatever the publisher said.
      # RUNS UNDER `dry-run` TOO, because it reads and never writes. Gating a
      # read-only bucket comparison on whether THIS run publishes made the one
      # question worth asking cost a full publish to ask: a `dry-run` build with
      # `render-over-live: false` reaches this step in minutes and carries the
      # same 13 `assets/` files, which is all the comparison needs.
      #
      # Under `dry-run` it is INFORMATIONAL — it still exits non-zero, because a
      # bucket missing objects the tree carries is a true finding whether or not
      # this run was going to fix it, and a dry run that reports it as fine would
      # be the same silence this step exists to break.
      #
      # WITH ONE EXCEPTION, AND IT IS NOT A SOFTENING. Under `dry-run` a key
      # missing from a CONTENT-HASHED prefix is a tautology, not a finding: the
      # tree names the object after its own bytes, so any change to the
      # stylesheet invents a key no bucket can hold until something uploads it,
      # and a dry run uploads nothing. Run 38885739966 is the worked example —
      # `assets/: tree 16, bucket 16, missing 0` (all nine `ct-icons` present by
      # name), and then `_a/: tree 1, bucket 2, missing 1` with
      # `MISSING _a/3d44ac2c9fc6d8d1.css`, a hash this branch's CSS had just
      # produced. The step failed with "A publish that ends here did not
      # finish", which was false: nothing was meant to finish.
      #
      # The discriminator is the PREFIX, not the run mode, and this step already
      # draws it in the other direction — it prints bucket-only keys as
      # "expected for content-hashed names" and does not fail on them. A
      # content-hashed name is expected to differ between a tree and a bucket in
      # BOTH directions; the asymmetry was the bug. Under a real publish the
      # exception does not apply at all: the publisher was supposed to upload
      # that key, so missing then is exactly the unfinished publish this step
      # was written to catch, and it still exits 1.
      #
      # The consequence of not fixing this is that the rehearsal is unusable:
      # no `dry-run` could be green again after any CSS change, so the one
      # signal that says "the production shape works" would be permanently red
      # for a reason that has nothing to do with production.
      #
      # THREE VERDICTS, NOT TWO: 0 the bucket holds them, 1 it does not, 2 this
      # step could not look. The third is new and is the reason the listing is
      # no longer `2>/dev/null … || true` — see the comment at the listing.
      - name: Does the bucket hold the site objects the tree does?
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ inputs.bucket }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            rc=0
            # ── DOES THE BUCKET EXIST AND CAN THIS IDENTITY READ IT? ───────
            #
            # ASKED SEPARATELY, BEFORE ANY PREFIX, because the listing below
            # cannot answer it. `aws s3 ls` reports an absent bucket, a wrong
            # endpoint, a rejected key AND an empty prefix all as zero keys —
            # and zero keys against a 16-file tree prints "missing from bucket
            # 16", naming sixteen objects as absent from a bucket nobody
            # managed to look inside. Measured on run 38639811606: `assets/:
            # tree 16, bucket 0, missing from bucket 16` for a bucket whose
            # existence was never established.
            #
            # NOT BY READING `s3 ls`s EXIT CODE EITHER, and this is checked
            # rather than remembered: awscli 2.35.11,
            # `customizations/s3/subcommands.py:_check_no_objects` —
            #
            #     if self._empty_result and self._at_first_page:
            #         # Nothing was returned in the first page of results when
            #         # listing the objects.
            #         return 1
            #
            # — so a prefix with no objects exits 1 with no output, and an
            # exit-code test would call an empty-but-valid `_a/` a failed
            # lookup. That is the same defect pointed the other way, which is
            # also why the `|| true` on the listing below STAYS. `head-bucket`
            # asks the bucket question with a call whose answer is only about
            # the bucket.
            if ! hb=$(aws s3api head-bucket --bucket "$BUCKET" \
                        --endpoint-url "$ENDPOINT" 2>&1); then
              echo "COULD NOT OPEN THE BUCKET — this step measured nothing."
              echo "$hb" | sed "s/^/      /"
              echo "::error title=DID NOT RUN::the bucket could not be opened, so" \
                   "\"missing from bucket\" could not be computed. An absent bucket," \
                   "a wrong endpoint and a rejected key are not an empty bucket, and" \
                   "an empty bucket against a populated tree reads as every object" \
                   "missing. Exiting 2 (did not run), not 1 (a finding)."
              exit 2
            fi
            echo "bucket: opened"
            # `_a/` is the content-hashed prefix; `assets/` is addressed by
            # stable names. Spelled here as data so the exception below names
            # the reason rather than the directory.
            content_hashed=" _a "
            for prefix in assets _a; do
              [ -d "site/$prefix" ] || { echo "$prefix/: not in the tree"; continue; }
              tree_keys=$(cd site && find "$prefix" -type f | sort)
              bucket_keys=$(aws s3 ls "s3://$BUCKET/$prefix/" --recursive \
                              --endpoint-url "$ENDPOINT" 2>/dev/null \
                            | awk "{print \$4}" | sort || true)
              missing=$(comm -23 <(printf "%s\n" "$tree_keys") <(printf "%s\n" "$bucket_keys"))
              n_tree=$(printf "%s\n" "$tree_keys" | grep -c . || true)
              n_bucket=$(printf "%s\n" "$bucket_keys" | grep -c . || true)
              n_missing=$(printf "%s\n" "$missing" | grep -c . || true)
              echo "$prefix/: tree $n_tree, bucket $n_bucket, missing from bucket $n_missing"
              # PRINT THE KEYS, NOT ONLY THE TALLY. "tree 16, bucket 16, missing
              # 0" was read as "the bucket holds what the tree does", while the
              # origin was 404ing nine assets/ct-icons/** objects at the same
              # minute. Equal counts and an empty comm -23 say only that the two
              # LISTS agree; reading that as a statement about nine particular
              # keys needs those keys to have been in the lists compared, and the
              # tally cannot say whether they were. So print both sides. Sixteen
              # lines is not a log problem; a tally that has to be reasoned from
              # is.
              #
              # BUCKET-ONLY KEYS ARE NOT A FAILURE and are printed anyway: a
              # content-hashed name this tree has moved past is exactly what
              # should still be in the bucket, and an object nobody can account
              # for is worth seeing before it is worth refusing.
              #
              # AWK RATHER THAN head, BECAUSE head CLOSES THE PIPE. Under
              # set -o pipefail a truncating head makes the writer die of EPIPE
              # and the whole pipeline report failure, so a prefix with more keys
              # than the cap would turn this read-only step into a red one. awk
              # stops printing and keeps reading.
              bucket_only=$(comm -13 <(printf "%s\n" "$tree_keys") <(printf "%s\n" "$bucket_keys"))
              n_only=$(printf "%s\n" "$bucket_only" | grep -c . || true)
              cap=60
              printf "%s\n" "$tree_keys"   | awk -v c=$cap "NF && ++i<=c {print \"    tree   \" \$0}"
              printf "%s\n" "$bucket_keys" | awk -v c=$cap "NF && ++i<=c {print \"    bucket \" \$0}"
              # `[ … ] && echo` WOULD END THE SCRIPT. Under set -e a false test is
              # a non-zero compound command, so the common one-liner aborts the
              # step on the ordinary case of a list that fits.
              if [ "$n_tree"   -gt "$cap" ]; then echo "    (tree list truncated at $cap of $n_tree)"; fi
              if [ "$n_bucket" -gt "$cap" ]; then echo "    (bucket list truncated at $cap of $n_bucket)"; fi
              if [ "$n_only" -gt 0 ]; then
                echo "    $n_only key(s) in the bucket and not in this tree — expected for content-hashed names:"
                printf "%s\n" "$bucket_only" | awk -v c=$cap "NF && ++i<=c {print \"    EXTRA  \" \$0}"
              fi
              if [ "$n_missing" -gt 0 ]; then
                printf "%s\n" "$missing" | awk -v c=$cap "NF && ++i<=c {print \"    MISSING \" \$0}"
                if [ "${{ inputs.dry-run }}" = "true" ] && \
                   case "$content_hashed" in *" $prefix "*) true;; *) false;; esac; then
                  echo "    the $n_missing key(s) above are content-hashed names this" \
                       "tree invented and this DRY RUN did not upload. Not a finding —" \
                       "see the comment on this step. A real publish uploads them and" \
                       "fails here if it did not."
                else
                  rc=1
                fi
              fi
            done
            # 1 and 2 are different verdicts and must not merge: 1 is "the
            # bucket is missing objects", a claim about the publish; 2 is "this
            # step could not look", a claim about itself. The message below is
            # only true of the first.
            if [ "$rc" -eq 1 ]; then
              echo "::error::the bucket is missing site objects this tree carries."                    "The publisher reported what it DECIDED to upload; this compares"                    "what the bucket HOLDS. A publish that ends here did not finish."
            fi
            exit $rc
          '

      # ── AND IS THAT BUCKET THE ONE THE SITE SERVES? ─────────────────────
      #
      # The step above listed `s3://${{ inputs.bucket }}/assets/` and found all
      # nine `assets/ct-icons/**` objects present, BY NAME. At the same hour
      # `https://blocktracer.org/assets/ct-icons/origin-icons/sigma.svg`
      # answered 404 with Cloudflare R2's own Not Found page — byte-identical to
      # the page a fabricated path gets — while `/assets/fonts/*` (2026-10-03),
      # `/assets/hydrate.js` (2026-10-13) and `/_a/0c49ff0f45fccc3a.css` all
      # answered 200 from the same prefix. R2 says the object is not there and
      # the S3 API says it is, and both are credible.
      #
      # They can only both be true if the API endpoint and the custom domain
      # address DIFFERENT buckets. This workflow has two sources for "the
      # bucket" and has never compared them: `inputs.bucket` is the publish
      # TARGET (required, no default, so a demo can be sent to staging) and
      # `secrets.R2_BUCKET` is the LIVE bucket the staging step reads. Nothing
      # asserts they agree when the target IS production.
      #
      # So compare them, and compare what each holds. NEITHER NAME IS PRINTED —
      # the output is a boolean and two key sets, which is everything the
      # question needs and nothing a log should carry.
      #
      # INFORMATIONAL, NEVER RED. A deliberate publish to staging makes these
      # two differ on purpose, and that is the case the input exists for. This
      # step reports; it does not judge.
      - name: Is the bucket this publishes into the bucket the site serves?
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ inputs.bucket }}
          LIVE_BUCKET: ${{ secrets.R2_BUCKET || 'blocktracer' }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -euo pipefail -c '
            if [ "$BUCKET" = "$LIVE_BUCKET" ]; then
              echo "target bucket vs live bucket: SAME NAME"
            else
              echo "target bucket vs live bucket: DIFFERENT NAMES"
              echo "  (inputs.bucket is not secrets.R2_BUCKET. If this run meant"
              echo "   production, every object it wrote went somewhere the site"
              echo "   does not read.)"
            fi
            # The same listing, against the LIVE bucket. A key the tree carries
            # and the live bucket lacks is the thing a visitor gets a 404 for,
            # whatever the target bucket holds.
            for prefix in assets _a; do
              [ -d "site/$prefix" ] || continue
              tree_keys=$(cd site && find "$prefix" -type f | sort)
              live_keys=$(aws s3 ls "s3://$LIVE_BUCKET/$prefix/" --recursive \
                            --endpoint-url "$ENDPOINT" 2>/dev/null \
                          | awk "{print \$4}" | sort || true)
              n_tree=$(printf "%s\n" "$tree_keys" | grep -c . || true)
              n_live=$(printf "%s\n" "$live_keys" | grep -c . || true)
              gone=$(comm -23 <(printf "%s\n" "$tree_keys") <(printf "%s\n" "$live_keys"))
              n_gone=$(printf "%s\n" "$gone" | grep -c . || true)
              echo "LIVE $prefix/: tree $n_tree, live bucket $n_live, absent from live $n_gone"
              printf "%s\n" "$gone" | awk "NF && ++i<=60 {print \"    ABSENT-FROM-LIVE \" \$0}"
            done
            # AND WHETHER THE SHARED OBJECT IS THE SAME OBJECT. Both buckets can
            # hold `assets/hydrate.js`; the sizes say whether they are the same
            # publish. `head-object` rather than a listing, because one key is
            # the question.
            # ── AN EXACT-KEY LOOKUP, BECAUSE A LISTING IS PARSED ───────────
            #
            # `aws s3 ls --recursive | awk "{print $4}"` takes the fourth
            # whitespace-separated field, so a key carrying anything after a
            # space is TRUNCATED to what came before it — and a key truncated to
            # exactly the tree key compares equal while naming a different
            # object. The listing above therefore cannot tell "the key is there"
            # from "a key whose printed prefix matches is there", and nothing in
            # it would show the difference.
            #
            # `head-object` takes the key as an argument and cannot truncate it.
            # So ask for each key the tree carries, by name. A key the listing
            # claimed and `head-object` cannot find is the listing being parsed
            # wrong. A key both agree on, while the public origin answers 404
            # with R2 own Not Found page, is something else entirely — and
            # knowing which of those two it is, is the whole question.
            #
            # NO HEREDOC. A heredoc terminator has to sit at column zero and all
            # of this is indented inside a YAML block scalar, so it would never
            # terminate — the same trap the registry guard above records. Process
            # substitution keeps the loop in THIS shell, so the counter survives
            # it, which a pipe into `while` would not.
            for prefix in assets _a; do
              [ -d "site/$prefix" ] || continue
              nf=0
              nq=0
              while IFS= read -r k; do
                [ -n "$k" ] || continue
                nq=$((nq + 1))
                meta=$(aws s3api head-object --bucket "$LIVE_BUCKET" --key "$k" \
                         --endpoint-url "$ENDPOINT" \
                         --query "[ContentLength,ETag,ContentType,LastModified]" --output text \
                         2>/dev/null || true)
                if [ -z "$meta" ]; then
                  echo "    HEAD-404 $k"
                  nf=$((nf + 1))
                else
                  # SIZE, ETAG, TYPE AND LAST-MODIFIED, because "the key
                  # exists" is not "the object is the file". An object of the
                  # wrong length or a different type is a publisher defect an
                  # existence check cannot see. LAST-MODIFIED is the timeline:
                  # an object written minutes ago and one written eleven days ago
                  # are different explanations for the same 404 at the origin,
                  # and the public response carries only the view the origin has.
                  # Printed beside the tree size so the comparison needs no
                  # second step and no second run.
                  local_sz=$(wc -c < "site/$k" | tr -d " ")
                  echo "    HEAD-200 $k  tree=$local_sz  bucket=$meta"
                fi
              done < <(cd site && find "$prefix" -type f | sort)
              echo "exact-key lookups in the live bucket for $prefix/: $nq asked, $nf not found"
            done

            # LABEL BY POSITION, NOT BY COMPARING THE NAME BACK. When the two
            # names are equal the comparison matches on both passes and prints
            # TARGET twice, which reads as the live bucket having been skipped.
            for pair in "TARGET:$BUCKET" "LIVE  :$LIVE_BUCKET"; do
              label=${pair%%:*}
              b=${pair#*:}
              sz=$(aws s3api head-object --bucket "$b" --key assets/hydrate.js \
                     --endpoint-url "$ENDPOINT" --query ContentLength --output text \
                     2>/dev/null || echo "unreadable")
              echo "assets/hydrate.js in the $label bucket: $sz byte(s)"
            done
          '

      # NAMED FOR WHAT IT DOES. This step used to be called "Ask the bucket what
      # it actually holds", and it asks the bucket nothing: the script it runs is
      # a static guard that `blocktracer-verify-published` contains no write
      # method ("scanned 5 file(s) for 4 write method(s)"). That guard is worth
      # keeping and worth running — the credential in this job is read-write and
      # that lint is the only thing standing between it and a production object —
      # but its green was being read as "the publish is verified", which it has
      # never meant. The bucket comparison above is the step that asks.
      - name: Can the published-tree verifier write? (it must not)
        if: ${{ inputs.dry-run == false }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'blocktracer' }}
        run: |
          set -euo pipefail
          if [ -x ci/test/verify-published-readonly.sh ]; then
            nix develop .#ci --command ci/test/verify-published-readonly.sh
          else
            echo "::error::The published-tree verifier is not on this branch," \
                 "so this publish went out UNVERIFIED. Land PR #40 and re-run" \
                 "this workflow with dry-run=false to check the bucket, or run" \
                 "the verifier by hand against the endpoint above. Refusing to" \
                 "report a publish as complete without it."
            exit 1
          fi

      # AND DOES THE PUBLISHED TREE CARRY CODETRACER'S DESIGN?
      #
      # The step above asks whether the data is there. This asks whether what a
      # VISITOR SEES is the IDE, and the two have been independent in exactly
      # the direction that matters: measured on live blocktracer.org on
      # 2026-10-12, every existence and freshness check passed over a
      # stylesheet with ZERO `.component-container` rules, eight of twelve
      # `url()`s relative and therefore 404, and transaction pages of 7,942
      # bytes with no `<script>` at all. The design was a month old and nothing
      # said so.
      #
      # The expected selectors are not listed here or in the checker: it reads
      # the LIVE rows of `client/src/components/ct_css_reach.txt`, the port's
      # own reachability register, so a newly ported component is covered by
      # existing and a row removed from the register stops being demanded.
      #
      # IT RUNS AGAINST THE PUBLIC ORIGIN, NOT THE BUCKET ENDPOINT, because the
      # claim is about what a visitor receives — including whether the origin's
      # own 404 behaviour turns a missing asset into a 200. A failure here means
      # the publish HAPPENED and the tree is wrong, which is a true and useful
      # thing to be red about: the remedy is another publish, not a retry.
      - name: Does the published tree carry CodeTracer's design?
        if: ${{ inputs.dry-run == false }}
        run: |
          set -euo pipefail
          nix develop .#ci --command node tools/deploy/check-design-parity.mjs \
            --origin "${{ inputs.verify-origin }}"
