name: ci-coverage-clock

# THE CLOCK THAT MAKES A MAINLINE VERDICT EXIST.
#
# WHAT IT IS FOR. `ci.yml` collapses pushes to one run per branch and cancels
# the superseded ones. On a saturated `eph-linux-x64` pool that setting does not
# gate the branch tip — it gates nothing, because the newest run is still
# PENDING when the next push evicts it. Measured on `dev` on 2026-09-03: of the
# last 25 `ci` runs, 21 cancelled, 3 failed, 0 successful, and no commit landed
# that day had a verdict of any kind. `ci.yml`'s concurrency block carries the
# full account.
#
# The remedy is ported from codetracer, where the same defect drained a 46-deep
# queue and cost 100% of mainline coverage: a DISPATCH-TRIGGERED run in its own
# concurrency group, which no push and no pull request is able to produce, and
# therefore which nothing can evict.
#
# ---------------------------------------------------------------------------
#
# WHY THE CLOCK IS HERE AND NOT A `schedule:` ON `ci.yml`.
#
# GitHub fires scheduled workflows ONLY from the default branch, and it runs
# that branch's copy of the file. A `schedule:` written into `ci.yml` therefore
# means "cover whatever branch happens to be default", which is:
#
#   * silently wrong for every OTHER branch this repository deploys —
#     `deploy.yml` ships `live`, `staging` and `dev`, and a schedule on `ci.yml`
#     would give exactly one of the three a scheduled verdict;
#   * correct-looking in review, because the file that needs the coverage and
#     the file that fires the clock are the same file, so nothing in the diff
#     says which branch it applies to; and
#   * load-bearing on a fact nobody restates when they change it. `dev` is the
#     default branch TODAY. If that moves to `main` — which exists, and is 178
#     commits behind — the scheduled run silently starts gating a branch nobody
#     ships from, and `dev` goes dark again with the YAML unchanged.
#
# So the clock is split from the trigger. This file is the only thing that
# needs to sit on the default branch; it names the refs it wants OUT LOUD, and
# a ref that stops existing is reported rather than skipped.
#
# THE COVERAGE RUN IS THE FULL `ci`, not a subset. A cheaper "coverage-only"
# lane would answer a different question from the one the pushes fail to
# answer, and the point is to restore the verdict that was lost, not to invent
# a weaker one.

on:
  schedule:
    # Every two hours. A full `ci` run is 10-15 minutes for most jobs, but
    # `journeys` is bounded at 150 and measured near 100, so a run can occupy
    # most of a two-hour window. This is a floor on how stale a mainline
    # verdict can be (~2h), not a promise of one every two hours — the guard
    # below skips a tick whose predecessor is still going.
    - cron: "0 */2 * * *"
  # So a verdict can be forced without waiting for the clock.
  workflow_dispatch:

# The clock must not stack up on itself.
concurrency:
  group: ci-coverage-clock
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire a coverage run for every branch we deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # EVERY BRANCH `deploy.yml` SHIPS FROM. Restored 2026-09-04 after
          # being narrowed to `dev` alone in `4c2d149`, on a measurement that
          # said the opposite of what it was read as saying.
          #
          # WHAT 4c2d149 ARGUED. That this lane is not "coverage on every
          # mainline" but the remedy for ONE mechanism — `ci.yml`'s
          # `cancel-in-progress` evicting a run before it places a job, which
          # needs a second push to the same branch within that window. That
          # describes `dev`, where several agents push every few minutes; it
          # does not describe `staging` or `live`, which move only on a
          # promotion. It then cited, "measured 2026-09-04 02:06, with the
          # fleet fully saturated: `33826220152` (staging, push) was
          # in_progress and `33826222157` (live, push) queued and intact."
          #
          # BOTH OF THOSE RUNS WERE CANCELLED, at the very minute they were
          # cited as healthy. Re-read from the API:
          #
          #   33826220152  staging  ci  push  completed/cancelled  02:06:23Z
          #   33826222157  live     ci  push  completed/cancelled  02:06:07Z
          #
          # The commit was authored 02:07:19Z — about a minute after the two
          # runs it named as survivors had been evicted. The observation was
          # true when taken and false when written down, which is why a status
          # read once mid-flight cannot carry a conclusion about whether runs
          # SURVIVE. The mechanism is also not what the argument assumed:
          # `staging` and `live` do not evict themselves with rapid pushes,
          # they are evicted by whatever else the saturated pool is doing.
          #
          # THE FILE'S OWN RE-ADD CONDITION IS MET, and it is written three
          # paragraphs down: "cancelled runs outnumbering conclusions on that
          # branch". Measured 2026-09-04 over each branch's last 60 `ci` runs:
          #
          #   branch    cancelled   failure   success
          #   dev              51         7         0
          #   staging          22         7         2
          #   live             19         5         2
          #
          # `live` took 8 promotions between 08:24Z and 14:08Z. Neither branch
          # has produced a success since 2026-09-02T08:29Z. So the premise the
          # narrowing rested on — "their push runs reach verdicts on their own"
          # — is not what the branches do.
          #
          # THE COST ARGUMENT WAS RIGHT, AND IS ANSWERED BELOW RATHER THAN
          # OVERRULED. A `ci` run really is TEN `eph-linux-x64` jobs since
          # `journeys-bite` became a 4-way matrix (counted from the file, not
          # remembered: contract, client-sdk, visual-design-canary, viewmodels,
          # debug-route, journeys, journeys-bite×4). Three refs dispatched
          # blindly every two hours against a pool observed running four at a
          # time would make this clock the biggest consumer of the capacity it
          # exists to extract a verdict from.
          #
          # What made that true was dispatching on a TIMER rather than on a
          # NEED. `staging` and `live` change only on a promotion, so a
          # two-hourly dispatch would re-run `ci` over an unchanged tip about
          # twelve times a day and learn the same thing each time. The tip-SHA
          # check below is the fix: a ref whose CURRENT tip already has a
          # conclusive `ci` run is skipped. Each ref then costs at most one
          # coverage run PER COMMIT rather than per tick — which is the number
          # that was actually wanted, and it is lower for `staging` and `live`
          # than the old `dev`-only lane cost by itself.
          #
          # WHEN A REF COULD LEAVE THIS LIST, stated so the next narrowing has a
          # bar to clear rather than an argument to make: when its PUSH runs
          # reach conclusions on their own — cancellations no longer
          # outnumbering `success` plus `failure` on that branch, over a window
          # long enough to contain several pushes. Read that from the API and
          # PASTE THE COUNTS, the way the table above does. The reason to insist
          # on a tally rather than a spot check is written into the history of
          # this file: `4c2d149` removed two refs on two run statuses read once,
          # mid-flight, and both had been cancelled by the time it was committed.
          # A single status says what a run was doing, never whether runs on
          # that branch survive.
          #
          # And a ref that leaves this list must not leave silently: the list is
          # meant to equal `deploy.yml`'s, so removing one means accepting that
          # a branch this repository PUBLISHES has no verdict lane, which is a
          # thing to say out loud in the commit that does it.
          refs="dev staging live"

          fired=0
          skipped=0
          covered=0
          pending=0
          missing=0

          for ref in ${refs}; do
            if ! git ls-remote --exit-code --heads \
                "https://github.com/${GH_REPO}.git" "${ref}" >/dev/null 2>&1; then
              # NOT a skip: a branch this clock names and cannot find is the
              # same "dead trigger reads like a working trigger" defect that
              # `ci-coverage.sh` step 4 was written for.
              echo "::error::branch '${ref}' is named by this clock and does not exist"
              missing=$((missing + 1))
              continue
            fi

            # (A dispatch runs the workflow AS THAT REF DEFINES IT, so a branch
            # whose `ci.yml` predates the `workflow_dispatch:` trigger cannot be
            # dispatched at all. That case is classified below, from the API's
            # own answer, rather than predicted from the file.)

            # Do not dispatch on top of a coverage run that is still going.
            # `ci.yml`'s dispatch lane sets `cancel-in-progress: false` — on
            # purpose, so that a later coverage run cannot cancel an earlier
            # one and reproduce the very defect this lane exists to escape.
            # The cost of that choice is that ticks would QUEUE behind a long
            # run, so the pile-up is prevented here, where "already running"
            # can actually be distinguished from "superseded".
            inflight="$(
              gh run list --workflow ci.yml --branch "${ref}" \
                --event workflow_dispatch --status in_progress \
                --json databaseId --jq 'length' 2>/dev/null || echo 0
            )"
            queued="$(
              gh run list --workflow ci.yml --branch "${ref}" \
                --event workflow_dispatch --status queued \
                --json databaseId --jq 'length' 2>/dev/null || echo 0
            )"
            if [ "${inflight:-0}" -gt 0 ] || [ "${queued:-0}" -gt 0 ]; then
              echo "${ref}: a coverage run is already in flight (${inflight} running, ${queued} queued) — not stacking another"
              skipped=$((skipped + 1))
              continue
            fi

            # DISPATCH ON A NEED, NOT ON A TIMER.
            #
            # This is what makes covering all three refs affordable, and it is
            # the answer to the cost argument in the block above rather than a
            # dismissal of it. A ref whose CURRENT TIP has already reached a
            # verdict does not need another run: `ci` over the same commit
            # answers the same question and spends ten scarce jobs doing it.
            #
            # It matters most exactly where the cost objection bit hardest.
            # `staging` and `live` move only on a promotion, so on most ticks
            # their tips are unchanged and this skips them outright; they cost
            # one coverage run per PROMOTION instead of twelve a day. `dev`
            # moves constantly, so it is rarely skipped here — which is the
            # correct distribution, and the opposite of the one a timer gives.
            #
            # SUCCESS OR FAILURE ONLY. A cancelled run is not a verdict — it is
            # precisely the non-answer this whole lane exists because of — so
            # it must not satisfy this test. `in_progress` and `queued` are
            # handled above and deliberately not repeated here.
            # `|| true` ON THE PIPELINE, for the reason spelled out further
            # down about `gh workflow run`: this step runs under `bash -e {0}`,
            # and `set -uo pipefail` does not take that away. A bare
            # `tip="$(git ls-remote ... | cut -f1)"` whose pipeline failed —
            # a network blip is enough — would abort the whole step before any
            # ref was dispatched, turning a transient error into a tick that
            # covers nothing. Empty `tip` is handled just below instead.
            tip="$(
              git ls-remote "https://github.com/${GH_REPO}.git" \
                "refs/heads/${ref}" 2>/dev/null | cut -f1 || true
            )"
            if [ -n "${tip}" ]; then
              # A COUNT, NOT A BOOLEAN, and `|| echo 0` so that an API hiccup
              # reads as "no verdict known" and dispatches. Failing OPEN is the
              # right direction for this one: a spurious extra coverage run
              # costs runner time, while a spurious skip costs the verdict, and
              # the verdict is the entire product of this file.
              verdicts="$(
                gh run list --workflow ci.yml --branch "${ref}" --limit 50 \
                  --json headSha,conclusion \
                  --jq "[.[] | select(.headSha == \"${tip}\")
                          | select(.conclusion == \"success\"
                                or .conclusion == \"failure\")] | length" \
                  2>/dev/null || echo 0
              )"
              # Force it to a number before comparing. `gh` failing halfway can
              # leave non-numeric text here, and `[ "abc" -gt 0 ]` does not
              # return false — it errors, which under `bash -e` aborts the step
              # and costs every ref its dispatch.
              case "${verdicts}" in
                ''|*[!0-9]*) verdicts=0 ;;
              esac
              if [ "${verdicts}" -gt 0 ]; then
                echo "${ref}: tip ${tip} already has a conclusive ci run — nothing to cover"
                covered=$((covered + 1))
                continue
              fi
            else
              echo "::warning::${ref}: could not read the remote tip, so dispatching without the already-covered check"
            fi

            # ASK, DO NOT PREDICT.
            #
            # The first draft of this decided whether a ref could accept a
            # dispatch by fetching its `ci.yml` through the contents API,
            # base64-decoding it and grepping for the trigger — with `2>/dev/null`
            # on both halves of the pipe. On the runner that pipeline produced
            # nothing for EVERY ref, including `dev`, which does carry the
            # trigger. So the clock reported all three mainlines as "awaiting the
            # trigger" and dispatched nothing, while every individual line of its
            # log looked reasonable. Measured, not reasoned about: run
            # 33815158002.
            #
            # That is the same defect as the gate it was written to serve — a
            # check that cannot reach its subject reporting a verdict anyway,
            # here by silently swallowing the two errors that would have said so.
            #
            # The remedy is to stop predicting what the API will accept and let
            # the API answer. A ref without the trigger comes back 422 naming
            # `workflow_dispatch`; that is a PENDING mainline. Anything else that
            # fails is a real failure and is reported with the error text, not
            # discarded.
            # `|| rc=$?` and not a bare assignment: GitHub runs this step under
            # `bash -e {0}`, and `set -uo pipefail` at the top does not take that
            # away. A bare `err="$(cmd)"` whose command failed would abort the
            # step before any of the classification below could run.
            rc=0
            err="$(gh workflow run ci.yml --ref "${ref}" 2>&1)" || rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "${ref}: coverage run dispatched"
              fired=$((fired + 1))
            elif printf '%s' "${err}" | grep -qi 'workflow_dispatch\|Workflow does not have'; then
              echo "::notice::${ref}: this branch's ci.yml predates the workflow_dispatch trigger, so no coverage run can be dispatched for it yet. It starts being covered when dev is promoted onto ${ref}. (${err})"
              pending=$((pending + 1))
            else
              echo "::error::${ref}: could not dispatch a coverage run: ${err}"
              missing=$((missing + 1))
            fi
          done

          echo
          echo "dispatched ${fired}, skipped ${skipped} (already running), ${covered} (tip already has a verdict), ${pending} awaiting the trigger, failed ${missing}"

          if [ "${missing}" -gt 0 ]; then
            exit 1
          fi

          # A tick that accounted for NO branch in any of the three healthy ways
          # has done nothing for any branch that could have been covered — and
          # in the run list that is indistinguishable from a clock that works.
          #
          # THE THREE THAT COUNT, and why each is coverage rather than an
          # excuse. `fired`: a run was started. `skipped`: one is still going,
          # so this branch is being covered right now. `covered`: its tip has
          # already reached a verdict, which is the outcome this lane exists to
          # produce — arriving at it without spending a runner is the lane
          # succeeding, not idling.
          #
          # `pending` still does not count. If every mainline were awaiting the
          # trigger this clock would produce no verdicts at all while reporting
          # success, which is the exact failure it was written to end.
          if [ "${fired}" -eq 0 ] && [ "${skipped}" -eq 0 ] && [ "${covered}" -eq 0 ]; then
            echo "::error::this tick dispatched nothing, skipped nothing and found no covered tip — no mainline is being covered by this clock"
            exit 1
          fi
