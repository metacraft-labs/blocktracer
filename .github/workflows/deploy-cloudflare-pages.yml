name: Deploy to Cloudflare Pages (reusable)

# ---------------------------------------------------------------------------
# REUSABLE, PARAMETERISED Cloudflare Pages deploy workflow for
# metacraft-labs/blocktracer.
#
# It BUILDS the full deployable static site HERMETICALLY through the repo's Nix
# flake (`nix build .#<flake-target>` -> `result/`) — no sibling checkouts
# required — and PUBLISHES it to a Cloudflare Pages project with wrangler run
# from the repo's flake-pinned `.#ci` dev shell.
#
# WHY this differs from the sibling isonim sites (web-site, reprobuild-web-site):
#   Those render their site in place with `just export` -> `dist/` and hand the
#   reusable a `build-command` + `output-dir`. BlockTracer's FULL deployable
#   site (index.html + the /d data tree + /idx + /t + /aztec entry pages +
#   /registry + assets) is produced by the flake PACKAGE `packages.default`, so
#   this workflow builds with `nix build` and then stages `result/`.
#
#   `result/` is a symlink into the read-only `/nix/store`. wrangler is happiest
#   uploading a plain, writable directory, so we dereference it into a clean
#   staging dir first (`cp -rL result site && chmod -R u+w site`) and deploy
#   THAT. This also sidesteps the two runner facts the sibling sites hit:
#   `wrangler pages deploy` does not honour `.assetsignore`, and the eph-linux
#   Nix runners have no preinstalled node/npx — so we deploy a CLEAN dir with
#   wrangler pinned by flake.lock (`nix develop .#ci`), never an ad-hoc npx.
#
# SINGLE-PROJECT DEPLOYER. This workflow deploys ONE `project-name` per call. It
# does NOT itself know about environments — the caller (deploy.yml) decides
# which Pages project a given branch/PR targets and passes it in `project-name`.
#
# WHY the caller maps branch -> project (the architecture note):
#   A Cloudflare Pages *project custom domain* ALWAYS serves that project's
#   PRODUCTION deployment. You therefore cannot serve `staging.<domain>` /
#   `dev.<domain>` from branch aliases of one project. The proven model is ONE
#   PAGES PROJECT PER ENVIRONMENT, each with its own production branch + custom
#   domain. The caller maps:
#       live    branch -> blocktracer          project (prod branch `live`)
#       staging branch -> blocktracer-staging   project (prod branch `staging`)
#       dev     branch -> blocktracer-dev       project (prod branch `dev`)
#       pull_request   -> blocktracer-dev       project -> native preview alias
#                         `<head-ref>.blocktracer-dev.pages.dev`
#   Cloudflare decides production-vs-preview by comparing the deployed `branch`
#   against the TARGET project's configured production branch (set at project
#   creation with wrangler), so this workflow only deploys the right branch to
#   the right project.
#
# NOTE: this is the Cloudflare PAGES deploy (the demo/static explorer). It is
# independent of the R2 delta-publisher go-live runbook in DEPLOY.md, which
# serves blocktracer.org from an R2 bucket — a separate, credentialed path.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      project-name:
        description: "Cloudflare Pages project to deploy to (create it with wrangler first). The caller computes this per branch/PR."
        required: true
        type: string
      flake-target:
        description: "Flake package to build. `nix build .#<flake-target>` must produce a `result/` that is the complete site."
        required: false
        default: "default"
        type: string
      runner:
        description: "Self-hosted runner label to run on."
        required: false
        default: "eph-linux-x64"
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token scoped to Pages:Edit for the metacraft-labs account (covers every per-env project on the account)."
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: "Cloudflare account id (metacraft-labs: 803741d99690718276ea30950f690c46)."
        required: true

jobs:
  deploy:
    name: Deploy (${{ inputs.project-name }})
    runs-on: ${{ inputs.runner }}
    # Records a GitHub deployment per branch (live/staging/dev) or `preview` for
    # PRs. Attach protection rules (e.g. required reviewers on `live`) in the
    # repo's Settings -> Environments if desired.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || github.ref_name }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy branch
        # For a PR, use the source branch so the deployment gets its own
        # `<head-ref>.<project>.pages.dev` alias. For a push, use the pushed
        # branch (live/staging/dev). Cloudflare decides production-vs-preview by
        # comparing this to the TARGET project's configured production branch.
        id: vars
        shell: bash
        env:
          # Pass refs through the environment (not inline `${{ }}`) so a crafted
          # branch name cannot inject into the script. See actionlint [expression].
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site (hermetic — nix flake package)
        # The repo's flake pins all build inputs (isonim + nim-everywhere +
        # codetracer-design-system as flake inputs), so this needs no sibling
        # checkouts. `flake-target` is a workflow_call input (set by the trusted
        # caller), not attacker-controlled.
        env:
          FLAKE_TARGET: ${{ inputs.flake-target }}
        run: nix build ".#${FLAKE_TARGET}"

      - name: Stage a clean, writable publish dir
        # `result` is a symlink into the read-only /nix/store. wrangler deploys a
        # plain writable directory most reliably, so dereference symlinks
        # (`-L`) into `site/` and restore write bits. `site/` is the CLEAN dir we
        # upload — nothing extraneous, no `.assetsignore` reliance.
        run: |
          set -euo pipefail
          rm -rf site
          cp -rL result site
          chmod -R u+w site
          echo "Staged $(find site -type f | wc -l) files, $(du -sh site | cut -f1) total."

      - name: Deploy to Cloudflare Pages
        id: deploy
        # The self-hosted eph-* runners are Nix runners with no preinstalled
        # node/npx, so the npx-based cloudflare/pages-action and wrangler-action
        # both fail with `npx: command not found`. We do not preinstall software
        # on runners — we run wrangler from the repo's flake-pinned `.#ci`
        # execution environment (wrangler pinned by flake.lock). wrangler
        # authenticates from CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project-name }}
          DEPLOY_BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          set -euo pipefail
          nix develop .#ci --command wrangler pages deploy site \
            --project-name="$PROJECT_NAME" \
            --branch="$DEPLOY_BRANCH" \
            --commit-dirty=true | tee wrangler-deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' wrangler-deploy.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"
