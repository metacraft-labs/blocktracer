# BlockTracer IsoNim client — Nim search paths.
#
# Mirrors the isonim-website / codetracer-web-site pattern: pin sibling
# ../../isonim/src and ../../nim-everywhere/src checkouts for the LOCAL-DEV
# workflow. `src` is on the path so `import components/...`, `import pages/...`,
# `import design_system/...` resolve; `../src` is the blocktracer repo's own
# `src`, so the client IMPORTS the data contract + demo generator
# (`blocktracer/contract/...`, `blocktracer/demo/...`) rather than duplicating
# the schema.
--path:"src"
--path:"../src"
--path:"../../isonim/src"
--path:"../../nim-everywhere/src"

# The sibling isonim / nim-everywhere paths above are the LOCAL-DEV fallback. For
# a hermetic public-repo / CI build (no adjacent checkouts) they are provided as
# pinned Nix flake inputs (../flake.nix) via ISONIM_SRC / NIM_EVERYWHERE_SRC,
# which config.nims adds to the search path (nim.cfg cannot expand env vars). Nim
# ignores the non-existent sibling paths above in that case.
#
# THAT REASONING COVERS THE ABSENT SIBLING AND NOT THE PRESENT ONE, which is the
# case that bites. When an adjacent `../../isonim` DOES exist, its path is on the
# search list alongside the pin, and a build can resolve part of isonim from the
# sibling and part from the nix store. On 2026-11-04 `just export-hydrated` failed
# that way: a pinned `isonim_event_log_view.nim` out of /nix/store instantiated
# `reconcileArrays`, which resolved to the SIBLING's `core/reconcile.nim`, and the
# type mismatch was reported at a path in another repository with nothing to say
# that two isonim trees were in play. The sibling was clean and on its own mainline
# — it simply was not the revision this client is pinned to.
#
# So a local build is only meaningful when the sibling is at the pinned revision,
# or when these paths are excluded. Nothing here enforces either, and CI never
# meets the case because it has no siblings — which is exactly why the failure is
# confusing when a developer meets it.
#
# The codetracer-design-system is NOT added to the Nim path: its tokens are read
# as DTCG JSON at runtime by src/design_system/tokens.nim, which locates the repo
# via DESIGN_SYSTEM_SRC (set by ../flake.nix) or the sibling checkout.
